<!doctype html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>طرح ۴: شیشه‌ای مات و نئونی مدرن (Frosted Glass) | AI Speaking Plus</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #07090e;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Vazirmatn', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #ffffff;
            user-select: none;
            -webkit-user-select: none;
            position: relative;
        }

        /* Ambient Fluid Blobs in Background */
        .ambient-blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.45;
            pointer-events: none;
            will-change: transform;
        }

        .blob-1 {
            width: 320px;
            height: 320px;
            background: #0284c7;
            top: 20%;
            left: 20%;
            animation: floatBlob1 12s infinite alternate ease-in-out;
        }

        .blob-2 {
            width: 300px;
            height: 300px;
            background: #6366f1;
            bottom: 20%;
            right: 25%;
            animation: floatBlob2 14s infinite alternate ease-in-out;
        }

        .blob-3 {
            width: 240px;
            height: 240px;
            background: #e11d48;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            opacity: 0.25;
            animation: floatBlob3 10s infinite alternate ease-in-out;
        }

        /* Mock App Background (Visible during exit transition) */
        .mock-app-bg {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #0B0E17;
            color: #475569;
            font-size: 18px;
            font-weight: 600;
            z-index: 1;
        }

        /* Main Loader Overlay Container */
        #loaderOverlay {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            background: rgba(7, 9, 14, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1), transform 0.6s cubic-bezier(0.16, 1, 0.3, 1), filter 0.6s ease;
        }

        #loaderOverlay.reveal-exit {
            opacity: 0;
            transform: scale(1.04);
            filter: blur(16px);
            pointer-events: none;
        }

        /* Glass Floating Card */
        .glass-card {
            position: relative;
            width: 90%;
            max-width: 390px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(36px);
            -webkit-backdrop-filter: blur(36px);
            border-radius: 32px;
            padding: 38px 28px 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.8), inset 0 1.5px 0 0 rgba(255, 255, 255, 0.18);
        }

        .logo-wrap {
            position: relative;
            width: 88px;
            height: 88px;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: floatLogo 3.6s ease-in-out infinite;
        }

        .logo-glow {
            position: absolute;
            inset: -14px;
            background: radial-gradient(circle, rgba(56, 189, 248, 0.5) 0%, rgba(99, 102, 241, 0.25) 50%, transparent 72%);
            border-radius: 50%;
            animation: pulseGlow 2.5s ease-in-out infinite;
            filter: blur(10px);
        }

        .logo-img {
            position: relative;
            width: 84px;
            height: 84px;
            border-radius: 24px;
            box-shadow: 0 16px 36px -6px rgba(0, 0, 0, 0.75), 0 0 0 1.5px rgba(255, 255, 255, 0.2);
            display: block;
            object-fit: cover;
            background: #0f172a;
        }

        .app-title {
            margin-top: 22px;
            font-family: 'Poppins', sans-serif;
            font-size: 23px;
            font-weight: 700;
            letter-spacing: -0.4px;
            background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .app-subtitle {
            margin-top: 6px;
            font-size: 13.5px;
            font-weight: 500;
            color: #94a3b8;
            line-height: 1.5;
        }

        /* Equalizer Wave */
        .wave-container {
            margin-top: 26px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            height: 24px;
        }

        .wave-bar {
            width: 3.5px;
            height: 8px;
            background: linear-gradient(180deg, #38bdf8 0%, #818cf8 100%);
            border-radius: 999px;
            animation: waveBounce 1.1s ease-in-out infinite alternate;
            box-shadow: 0 0 8px rgba(56, 189, 248, 0.4);
        }

        .wave-bar:nth-child(1) { animation-delay: 0.0s; height: 10px; }
        .wave-bar:nth-child(2) { animation-delay: 0.18s; height: 18px; }
        .wave-bar:nth-child(3) { animation-delay: 0.36s; height: 26px; }
        .wave-bar:nth-child(4) { animation-delay: 0.54s; height: 16px; }
        .wave-bar:nth-child(5) { animation-delay: 0.72s; height: 10px; }

        .status-txt {
            margin-top: 16px;
            font-size: 12.5px;
            color: #64748b;
            font-weight: 500;
        }

        .test-action-btn {
            margin-top: 22px;
            padding: 8px 18px;
            background: rgba(56, 189, 248, 0.12);
            border: 1px solid rgba(56, 189, 248, 0.35);
            border-radius: 20px;
            color: #38bdf8;
            font-size: 12px;
            font-weight: 600;
            font-family: 'Vazirmatn', sans-serif;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .test-action-btn:hover {
            background: rgba(56, 189, 248, 0.25);
            color: #fff;
            transform: scale(1.03);
        }

        @keyframes floatLogo {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-7px); }
        }

        @keyframes pulseGlow {
            0%, 100% { transform: scale(0.95); opacity: 0.35; }
            50% { transform: scale(1.2); opacity: 0.7; }
        }

        @keyframes waveBounce {
            0% { transform: scaleY(0.4); opacity: 0.45; }
            100% { transform: scaleY(1.4); opacity: 1; }
        }

        @keyframes floatBlob1 {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(50px, 40px) scale(1.15); }
        }

        @keyframes floatBlob2 {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(-40px, -60px) scale(1.1); }
        }

        @keyframes floatBlob3 {
            0% { transform: translate(-50%, -50%) scale(1); }
            100% { transform: translate(-40%, -60%) scale(1.25); }
        }
    </style>
</head>
<body>
    <div class="ambient-blob blob-1"></div>
    <div class="ambient-blob blob-2"></div>
    <div class="ambient-blob blob-3"></div>

    <div class="mock-app-bg">
        <p>محیط اصلی برنامه AI Speaking Plus</p>
        <span style="font-size: 13px; color: #38bdf8; margin-top: 8px; cursor: pointer;" onclick="resetLoader()">↻ بازگرداندن لودینگ</span>
    </div>

    <div id="loaderOverlay">
        <div class="glass-card">
            <div class="logo-wrap">
                <div class="logo-glow"></div>
                <img src="./apple-touch-icon.png" class="logo-img" alt="AI Speaking Plus">
            </div>
            <div class="app-title">AI Speaking Plus</div>
            <div class="app-subtitle">ماجراجویی مکالمه انگلیسی با هوش مصنوعی</div>

            <div class="wave-container">
                <span class="wave-bar"></span>
                <span class="wave-bar"></span>
                <span class="wave-bar"></span>
                <span class="wave-bar"></span>
                <span class="wave-bar"></span>
            </div>

            <div class="status-txt">در حال اتصال امن به سرور...</div>

            <button class="test-action-btn" onclick="testExitAnimation()">
                ✨ تست ترنزیشن محوشدن نرم به صفحه اصلی
            </button>
        </div>
    </div>

    <script>
        function testExitAnimation() {
            const overlay = document.getElementById("loaderOverlay");
            overlay.classList.add("reveal-exit");
        }

        function resetLoader() {
            const overlay = document.getElementById("loaderOverlay");
            overlay.classList.remove("reveal-exit");
        }
    </script>
</body>
</html>
