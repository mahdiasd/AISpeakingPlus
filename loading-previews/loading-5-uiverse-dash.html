<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AISpeaking</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #080A10;
            background: radial-gradient(circle at 50% 50%, #141a2f 0%, #0d1120 50%, #06080e 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            -webkit-user-select: none;
        }

        .loader-ambient-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 260px;
            height: 140px;
            background: radial-gradient(ellipse at center, rgba(82, 159, 246, 0.4) 0%, rgba(82, 159, 246, 0.12) 45%, transparent 75%);
            filter: blur(30px);
            border-radius: 50%;
            pointer-events: none;
            animation: ambientFocusPulse 3s ease-in-out infinite;
        }

        @keyframes ambientFocusPulse {
            0%, 100% {
                transform: translate(-50%, -50%) scale(0.92);
                opacity: 0.65;
            }
            50% {
                transform: translate(-50%, -50%) scale(1.18);
                opacity: 0.95;
            }
        }

        /* From Uiverse.io by NlghtM4re */ 
        .container {
          position: absolute;
          top: 50%;
          left: 50%;
          transform: translate(-50%, -50%);
          display: flex;
        }

        .dash {
          margin: 0 15px;
          width: 35px;
          height: 15px;
          border-radius: 8px;
          background: rgb(82, 159, 246);
          box-shadow: rgb(82, 159, 246) 0 0 15px 0;
        }

        .first {
          margin-right: -18px;
          transform-origin: center left;
          animation: spin 3s linear infinite;
        }

        .seconde {
          transform-origin: center right;
          animation: spin2 3s linear infinite;
          animation-delay: .2s;
        }

        .third {
          transform-origin: center right;
          animation: spin3 3s linear infinite;
          animation-delay: .3s;
        }

        .fourth {
          transform-origin: center right;
          animation: spin4 3s linear infinite;
          animation-delay: .4s;
        }

        @keyframes spin {
          0% {
            transform: rotate(0deg);
          }

          25% {
            transform: rotate(360deg);
          }

          30% {
            transform: rotate(370deg);
          }

          35% {
            transform: rotate(360deg);
          }

          100% {
            transform: rotate(360deg);
          }
        }

        @keyframes spin2 {
          0% {
            transform: rotate(0deg);
          }

          20% {
            transform: rotate(0deg);
          }

          30% {
            transform: rotate(-180deg);
          }

          35% {
            transform: rotate(-190deg);
          }

          40% {
            transform: rotate(-180deg);
          }

          78% {
            transform: rotate(-180deg);
          }

          95% {
            transform: rotate(-360deg);
          }

          98% {
            transform: rotate(-370deg);
          }

          100% {
            transform: rotate(-360deg);
          }
        }

        @keyframes spin3 {
          0% {
            transform: rotate(0deg);
          }

          27% {
            transform: rotate(0deg);
          }

          40% {
            transform: rotate(180deg);
          }

          45% {
            transform: rotate(190deg);
          }

          50% {
            transform: rotate(180deg);
          }

          62% {
            transform: rotate(180deg);
          }

          75% {
            transform: rotate(360deg);
          }

          80% {
            transform: rotate(370deg);
          }

          85% {
            transform: rotate(360deg);
          }

          100% {
            transform: rotate(360deg);
          }
        }

        @keyframes spin4 {
          0% {
            transform: rotate(0deg);
          }

          38% {
            transform: rotate(0deg);
          }

          60% {
            transform: rotate(-360deg);
          }

          65% {
            transform: rotate(-370deg);
          }

          75% {
            transform: rotate(-360deg);
          }

          100% {
            transform: rotate(-360deg);
          }
        }
    </style>
</head>
<body>
    <div class="loader-ambient-glow"></div>
    <!-- From Uiverse.io by NlghtM4re --> 
    <div class="container">
      <div class="dash first"></div>
      <div class="dash seconde"></div>
      <div class="dash third"></div>
      <div class="dash fourth"></div>
    </div>
</body>
</html>
