<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <base href="/app/">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
        <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png">
        <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16x16.png">
        <link rel="manifest" href="./manifest.json">
        <title>AI Speaking Plus</title>
        <style>
            html,
            body {
                width: 100%;
                height: 100%;
                margin: 0;
                padding: 0;
                overflow: hidden;
            }
        </style>
    </head>
    <body style="text-align: center; align-content: center">
    <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 50 50" role="presentation">
        <circle cx="25" cy="25" r="20" stroke="#ccc" stroke-width="4" fill="none"/>
        <circle cx="25" cy="25" r="20" stroke="#333" stroke-width="4" fill="none" stroke-linecap="round" stroke-dasharray="90 125">
            <animateTransform attributeName="transform" type="rotate" from="0 25 25" to="360 25 25" dur="1s" repeatCount="indefinite"/>
        </circle>
    </svg>
    </body>
    <script>
        window.aiSpeakingRouter = {
            _popCounter: 0,
            init: function() {
                var self = this;
                window.addEventListener('popstate', function(e) {
                    self._popCounter++;
                });
            },
            getPopCounter: function() {
                return this._popCounter;
            },
            getCurrentPath: function() {
                return window.location.pathname;
            },
            getCurrentSearch: function() {
                return window.location.search || "";
            },
            getHash: function() {
                return window.location.hash || "";
            },
            pushUrl: function(url) {
                var cur = window.location.pathname + (window.location.search || "");
                if (cur !== url) {
                    window.history.pushState({ path: url }, "", url);
                }
            },
            replaceUrl: function(url) {
                var cur = window.location.pathname + (window.location.search || "");
                if (cur !== url) {
                    window.history.replaceState({ path: url }, "", url);
                }
            }
        };
        window.aiSpeakingRouter.init();

        window.aiSpeakingVideo = {
            overlay: null,
            video: null,
            _hasEnded: false,
            _hasSkipped: false,
            _isPlaying: false,

            show: function(src) {
                this._hasEnded = false;
                this._hasSkipped = false;
                this._isPlaying = false;

                if (!this.overlay) {
                    this._createDom();
                }

                var fullUrl = (src && (src.startsWith("http://") || src.startsWith("https://")))
                    ? src
                    : (window.location.origin + (src.startsWith("/") ? src : "/" + src));

                this.video.src = fullUrl;
                this.overlay.style.display = "flex";
                this.overlay.style.opacity = "1";
                this._updateMuteButton(false);

                var self = this;
                var playPromise = this.video.play();
                if (playPromise !== undefined) {
                    playPromise.then(function() {
                        self._isPlaying = true;
                    }).catch(function(err) {
                        console.warn("Autoplay with sound prevented, muting to start playback:", err);
                        self.video.muted = true;
                        self._updateMuteButton(true);
                        self.video.play().then(function() {
                            self._isPlaying = true;
                            self._showUnmuteHint();
                        }).catch(function(e) {
                            console.error("Video play failed:", e);
                        });
                    });
                }
            },

            hide: function() {
                if (this.video) {
                    try { this.video.pause(); } catch(e){}
                }
                if (this.overlay) {
                    this.overlay.style.display = "none";
                }
                this._isPlaying = false;
            },

            consumeEnded: function() {
                if (this._hasEnded) {
                    this._hasEnded = false;
                    return true;
                }
                return false;
            },

            consumeSkipped: function() {
                if (this._hasSkipped) {
                    this._hasSkipped = false;
                    return true;
                }
                return false;
            },

            _createDom: function() {
                var self = this;
                var overlay = document.createElement("div");
                overlay.id = "aiSpeakingVideoOverlay";
                overlay.style.position = "fixed";
                overlay.style.top = "0";
                overlay.style.left = "0";
                overlay.style.width = "100%";
                overlay.style.height = "100%";
                overlay.style.backgroundColor = "rgba(0,0,0,0.92)";
                overlay.style.zIndex = "99999";
                overlay.style.display = "none";
                overlay.style.flexDirection = "column";
                overlay.style.alignItems = "center";
                overlay.style.justifyContent = "center";
                overlay.style.transition = "opacity 0.3s ease";
                overlay.style.overflow = "hidden";

                var playerBox = document.createElement("div");
                playerBox.style.position = "relative";
                playerBox.style.width = "100%";
                playerBox.style.maxWidth = "430px";
                playerBox.style.height = "100%";
                playerBox.style.maxHeight = "900px";
                playerBox.style.display = "flex";
                playerBox.style.flexDirection = "column";
                playerBox.style.justifyContent = "center";
                playerBox.style.alignItems = "center";
                playerBox.style.backgroundColor = "#000";
                playerBox.style.borderRadius = (window.innerWidth > 560) ? "16px" : "0";
                playerBox.style.boxShadow = "0 25px 50px -12px rgba(0, 0, 0, 0.7)";
                playerBox.style.overflow = "hidden";

                var video = document.createElement("video");
                video.setAttribute("playsinline", "");
                video.setAttribute("webkit-playsinline", "");
                video.setAttribute("preload", "auto");
                video.style.width = "100%";
                video.style.height = "100%";
                video.style.objectFit = "cover";
                video.style.backgroundColor = "#000";

                // Top Controls Bar
                var topBar = document.createElement("div");
                topBar.style.position = "absolute";
                topBar.style.top = "16px";
                topBar.style.left = "16px";
                topBar.style.right = "16px";
                topBar.style.display = "flex";
                topBar.style.justifyContent = "space-between";
                topBar.style.alignItems = "center";
                topBar.style.zIndex = "10";
                topBar.style.direction = "rtl";

                // Skip Button
                var skipBtn = document.createElement("button");
                skipBtn.innerHTML = "رد کردن ›";
                skipBtn.style.padding = "8px 18px";
                skipBtn.style.backgroundColor = "rgba(255, 255, 255, 0.2)";
                skipBtn.style.backdropFilter = "blur(12px)";
                skipBtn.style.webkitBackdropFilter = "blur(12px)";
                skipBtn.style.border = "1px solid rgba(255, 255, 255, 0.35)";
                skipBtn.style.borderRadius = "20px";
                skipBtn.style.color = "#ffffff";
                skipBtn.style.fontSize = "13px";
                skipBtn.style.fontWeight = "600";
                skipBtn.style.fontFamily = "Vazirmatn, system-ui, sans-serif";
                skipBtn.style.cursor = "pointer";
                skipBtn.style.boxShadow = "0 4px 12px rgba(0,0,0,0.3)";
                skipBtn.onclick = function(e) {
                    e.stopPropagation();
                    self._hasSkipped = true;
                    self.hide();
                };

                // Sound Toggle Button
                var soundBtn = document.createElement("button");
                soundBtn.id = "videoMuteBtn";
                soundBtn.innerHTML = "🔊";
                soundBtn.style.width = "38px";
                soundBtn.style.height = "38px";
                soundBtn.style.backgroundColor = "rgba(255, 255, 255, 0.2)";
                soundBtn.style.backdropFilter = "blur(12px)";
                soundBtn.style.webkitBackdropFilter = "blur(12px)";
                soundBtn.style.border = "1px solid rgba(255, 255, 255, 0.35)";
                soundBtn.style.borderRadius = "50%";
                soundBtn.style.color = "#ffffff";
                soundBtn.style.fontSize = "16px";
                soundBtn.style.cursor = "pointer";
                soundBtn.style.display = "flex";
                soundBtn.style.alignItems = "center";
                soundBtn.style.justifyContent = "center";
                soundBtn.onclick = function(e) {
                    e.stopPropagation();
                    self.video.muted = !self.video.muted;
                    self._updateMuteButton(self.video.muted);
                    self._hideUnmuteHint();
                };

                topBar.appendChild(skipBtn);
                topBar.appendChild(soundBtn);

                // Unmute hint
                var unmuteHint = document.createElement("div");
                unmuteHint.id = "videoUnmuteHint";
                unmuteHint.innerHTML = "🔊 برای شنیدن صدا لمس کنید";
                unmuteHint.style.position = "absolute";
                unmuteHint.style.bottom = "24px";
                unmuteHint.style.backgroundColor = "rgba(30, 41, 59, 0.85)";
                unmuteHint.style.backdropFilter = "blur(8px)";
                unmuteHint.style.border = "1px solid rgba(59, 130, 246, 0.5)";
                unmuteHint.style.color = "#60A5FA";
                unmuteHint.style.padding = "8px 16px";
                unmuteHint.style.borderRadius = "20px";
                unmuteHint.style.fontSize = "13px";
                unmuteHint.style.fontWeight = "bold";
                unmuteHint.style.fontFamily = "Vazirmatn, sans-serif";
                unmuteHint.style.cursor = "pointer";
                unmuteHint.style.display = "none";
                unmuteHint.style.zIndex = "10";
                unmuteHint.onclick = function(e) {
                    e.stopPropagation();
                    self.video.muted = false;
                    self._updateMuteButton(false);
                    self._hideUnmuteHint();
                };

                video.onclick = function() {
                    if (video.muted) {
                        video.muted = false;
                        self._updateMuteButton(false);
                        self._hideUnmuteHint();
                    } else if (video.paused) {
                        video.play();
                    } else {
                        video.pause();
                    }
                };

                video.onended = function() {
                    self._hasEnded = true;
                    self.hide();
                };

                playerBox.appendChild(video);
                playerBox.appendChild(topBar);
                playerBox.appendChild(unmuteHint);
                overlay.appendChild(playerBox);
                document.body.appendChild(overlay);

                this.overlay = overlay;
                this.video = video;
                this.muteBtn = soundBtn;
                this.unmuteHint = unmuteHint;
            },

            _updateMuteButton: function(muted) {
                if (this.muteBtn) {
                    this.muteBtn.innerHTML = muted ? "🔇" : "🔊";
                }
            },

            _showUnmuteHint: function() {
                if (this.unmuteHint) {
                    this.unmuteHint.style.display = "block";
                }
            },

            _hideUnmuteHint: function() {
                if (this.unmuteHint) {
                    this.unmuteHint.style.display = "none";
                }
            }
        };

        window._isAudioPlaying = false;
        window._aiSpeakingAudioPool = window._aiSpeakingAudioPool || {};
        window.aiSpeakingAudio = {
            audio: null,
            _currentUrl: null,

            isPlaying: function() {
                return window._isAudioPlaying === true;
            },

            preload: function(url) {
                if (!url) return;
                var fullUrl = (url.startsWith("http://") || url.startsWith("https://")) ? url : (window.location.origin + (url.startsWith("/") ? url : "/" + url));
                if (!window._aiSpeakingAudioPool[fullUrl]) {
                    try {
                        var a = new Audio();
                        a.preload = "auto";
                        a.src = fullUrl;
                        a.load();
                        window._aiSpeakingAudioPool[fullUrl] = a;
                    } catch(e) {
                        console.warn("[aiSpeakingAudio] preload error:", e);
                    }
                }
            },

            play: function(url) {
                if (!url) {
                    this.stop();
                    return;
                }

                if (this.audio) {
                    try {
                        this.audio.pause();
                        this.audio.currentTime = 0;
                    } catch(e){}
                    this.audio = null;
                }

                var fullUrl = (url.startsWith("http://") || url.startsWith("https://")) ? url : (window.location.origin + (url.startsWith("/") ? url : "/" + url));
                var self = this;
                self._currentUrl = fullUrl;

                var audio = window._aiSpeakingAudioPool[fullUrl];
                if (!audio) {
                    audio = new Audio();
                    audio.preload = "auto";
                    audio.src = fullUrl;
                    window._aiSpeakingAudioPool[fullUrl] = audio;
                }

                self.audio = audio;
                window._isAudioPlaying = true;

                // Reset position so replay is immediate
                try {
                    audio.currentTime = 0;
                } catch(e) {}

                var finish = function() {
                    if (self._currentUrl === fullUrl) {
                        window._isAudioPlaying = false;
                    }
                };

                audio.onended = finish;
                audio.onerror = function(e) {
                    console.warn("[aiSpeakingAudio] Playback error, falling back:", e);
                    finish();
                };

                var playPromise = audio.play();
                if (playPromise !== undefined) {
                    playPromise.catch(function(err) {
                        console.warn("[aiSpeakingAudio] Play prevented or failed:", err);
                        finish();
                    });
                }
            },

            stop: function() {
                window._isAudioPlaying = false;
                if (this.audio) {
                    try {
                        this.audio.pause();
                        this.audio.currentTime = 0;
                    } catch(e){}
                    this.audio = null;
                }
            }
        };

        window.aiSpeakingSpeech = {
            recognition: null,
            mediaStream: null,
            audioContext: null,
            audioInputSource: null,
            audioProcessor: null,
            _pcmChunkQueue: [],
            _hasVoiceActivity: false,
            _lastVoiceActivityTime: 0,
            isRecording: false,
            _userWantsRecording: false,
            _micPermissionGranted: false,
            _restartTimeout: null,
            _accumulatedTranscript: "",
            _currentSessionTranscript: "",
            transcript: "",
            _consecutiveErrors: 0,
            _isMobile: false,
            _isIOS: false,

            _initDevice: function() {
                var ua = navigator.userAgent || '';
                this._isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(ua) ||
                                 (navigator.userAgentData && navigator.userAgentData.mobile) ||
                                 (navigator.maxTouchPoints && navigator.maxTouchPoints > 1);
                this._isIOS = /iPhone|iPad|iPod/i.test(ua) ||
                              (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
            },

            _checkSecureContext: function() {
                var isLocal = window.location.hostname === 'localhost' ||
                              window.location.hostname === '127.0.0.1' ||
                              window.location.hostname === '0.0.0.0' ||
                              window.location.hostname === '[::1]' ||
                              window.location.hostname.endsWith('.localhost');
                var isSecure = window.isSecureContext || window.location.protocol === 'https:' || isLocal;
                if (!isSecure) {
                    console.warn("[aiSpeakingSpeech] Insecure origin detected (" + window.location.origin + "). " +
                        "Microphone and Web Speech API will be blocked by browsers on non-localhost HTTP. " +
                        "Use HTTPS (or localhost) to enable audio recording.");
                }
                return isSecure;
            },

            _downsampleBuffer: function(buffer, sourceRate, targetRate) {
                if (sourceRate === targetRate || !buffer || buffer.length === 0) return buffer;
                var ratio = sourceRate / targetRate;
                var newLength = Math.round(buffer.length / ratio);
                var result = new Float32Array(newLength);
                var offsetResult = 0;
                var offsetBuffer = 0;
                while (offsetResult < result.length) {
                    var nextOffsetBuffer = Math.round((offsetResult + 1) * ratio);
                    var accum = 0, count = 0;
                    for (var i = offsetBuffer; i < nextOffsetBuffer && i < buffer.length; i++) {
                        accum += buffer[i];
                        count++;
                    }
                    result[offsetResult] = count > 0 ? (accum / count) : 0;
                    offsetResult++;
                    offsetBuffer = nextOffsetBuffer;
                }
                return result;
            },

            _floatToPcm16: function(samples) {
                var output = new Uint8Array(samples.length * 2);
                for (var i = 0; i < samples.length; i++) {
                    var s = Math.max(-1, Math.min(1, samples[i]));
                    var val = s < 0 ? s * 0x8000 : s * 0x7FFF;
                    var intVal = Math.floor(val);
                    output[i * 2] = intVal & 0xFF;
                    output[i * 2 + 1] = (intVal >> 8) & 0xFF;
                }
                return output;
            },

            _uint8ToBase64: function(u8) {
                var binary = '';
                var len = u8.byteLength;
                for (var i = 0; i < len; i++) {
                    binary += String.fromCharCode(u8[i]);
                }
                return window.btoa(binary);
            },

            start: function() {
                this._initDevice();
                this._checkSecureContext();

                if (this._restartTimeout) {
                    clearTimeout(this._restartTimeout);
                    this._restartTimeout = null;
                }

                this._userWantsRecording = true;
                this.isRecording = true;
                this.transcript = "";
                this._accumulatedTranscript = "";
                this._currentSessionTranscript = "";
                this._pcmChunkQueue = [];
                this._hasVoiceActivity = false;
                this._consecutiveErrors = 0;

                var self = this;

                // 1. Prime AudioContext synchronously in current user gesture (native 16000Hz preferred)
                var AudioContextClass = window.AudioContext || window.webkitAudioContext;
                if (AudioContextClass) {
                    try {
                        if (!window._aiSpeakingAudioCtx || window._aiSpeakingAudioCtx.state === 'closed') {
                            try {
                                window._aiSpeakingAudioCtx = new AudioContextClass({ sampleRate: 16000 });
                            } catch (errRate) {
                                window._aiSpeakingAudioCtx = new AudioContextClass();
                            }
                        }
                        self.audioContext = window._aiSpeakingAudioCtx;
                        if (self.audioContext && self.audioContext.state === 'suspended') {
                            self.audioContext.resume().catch(function(){});
                        }
                    } catch(e) {
                        console.warn("[aiSpeakingSpeech] AudioContext pre-creation error:", e);
                    }
                }

                var navMedia = navigator.mediaDevices;
                var getUserMediaFn = null;
                if (navMedia && navMedia.getUserMedia) {
                    getUserMediaFn = function(c) { return navMedia.getUserMedia(c); };
                } else if (navigator.getUserMedia) {
                    getUserMediaFn = function(c) { return new Promise(function(res, rej) { navigator.getUserMedia(c, res, rej); }); };
                } else if (navigator.webkitGetUserMedia) {
                    getUserMediaFn = function(c) { return new Promise(function(res, rej) { navigator.webkitGetUserMedia(c, res, rej); }); };
                }

                if (!getUserMediaFn) {
                    console.warn("[aiSpeakingSpeech] getUserMedia not available, trying speech recognition fallback");
                    this._startRecognitionInstance();
                    return;
                }

                var handleStreamAcquired = function(stream) {
                    if (!self._userWantsRecording) {
                        try { stream.getTracks().forEach(function(t) { t.stop(); }); } catch(e) {}
                        return;
                    }

                    self.mediaStream = stream;

                    if (!AudioContextClass) {
                        console.warn("[aiSpeakingSpeech] AudioContext not available, falling back to SpeechRecognition");
                        self._startRecognitionInstance();
                        return;
                    }

                    try {
                        if (!self.audioContext || self.audioContext.state === 'closed') {
                            try {
                                self.audioContext = new AudioContextClass({ sampleRate: 16000 });
                            } catch (errRate) {
                                self.audioContext = new AudioContextClass();
                            }
                        }
                        if (self.audioContext.state === 'suspended') {
                            self.audioContext.resume().catch(function(){});
                        }

                        self.audioInputSource = self.audioContext.createMediaStreamSource(stream);
                        self.audioProcessor = self.audioContext.createScriptProcessor(2048, 1, 1);
                        window._activeAudioProcessor = self.audioProcessor; // Keep reference to prevent GC in WebKit

                        self.audioProcessor.onaudioprocess = function(e) {
                            if (!self.isRecording) return;
                            var rawInput = e.inputBuffer.getChannelData(0);
                            var ctxRate = (self.audioContext && self.audioContext.sampleRate) ? self.audioContext.sampleRate : 16000;
                            var downsampled = self._downsampleBuffer(rawInput, ctxRate, 16000);
                            if (!downsampled || downsampled.length === 0) return;

                            var sumSquares = 0;
                            for (var k = 0; k < downsampled.length; k++) {
                                sumSquares += downsampled[k] * downsampled[k];
                            }
                            var rms = Math.sqrt(sumSquares / downsampled.length);
                            // Sensitive voice activity threshold (natural conversational level in Chrome is ~0.003 - 0.008)
                            if (rms > 0.003) {
                                self._hasVoiceActivity = true;
                                self._lastVoiceActivityTime = Date.now();
                            }

                            var pcm16Bytes = self._floatToPcm16(downsampled);
                            var b64Chunk = self._uint8ToBase64(pcm16Bytes);

                            if (typeof window.onAiSpeakingAudioChunk === 'function') {
                                try { window.onAiSpeakingAudioChunk(b64Chunk); } catch(err) {}
                            }

                            if (self._pcmChunkQueue.length > 200) {
                                self._pcmChunkQueue.shift();
                            }
                            self._pcmChunkQueue.push(b64Chunk);
                        };

                        var zeroGain = self.audioContext.createGain();
                        zeroGain.gain.value = 0;
                        self.zeroGain = zeroGain;

                        self.audioInputSource.connect(self.audioProcessor);
                        self.audioProcessor.connect(zeroGain);
                        zeroGain.connect(self.audioContext.destination);
                        self.isRecording = true;
                    } catch(err) {
                        console.error("[aiSpeakingSpeech] Web Audio processing graph error:", err);
                        self._startRecognitionInstance();
                    }
                };

                // On iOS WebKit (Safari & Chrome iOS), directly use { audio: true } to prevent user gesture token expiration
                var preferredConstraints = this._isIOS ? { audio: true } : {
                    audio: {
                        echoCancellation: { ideal: true },
                        noiseSuppression: { ideal: true },
                        autoGainControl: { ideal: true }
                    }
                };

                getUserMediaFn(preferredConstraints).then(handleStreamAcquired).catch(function(err) {
                    if (self._isIOS) {
                        console.error("[aiSpeakingSpeech] getUserMedia iOS error:", err);
                        self.isRecording = false;
                        self._userWantsRecording = false;
                        if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {
                            var msg = "دسترسی به میکروفون تایید نشد.\nلطفاً در تنظیمات آیفون (Settings > Chrome یا Safari > Microphone) دسترسی میکروفون را فعال کنید.";
                            if (!self._checkSecureContext()) {
                                msg += "\n\n(نکته: در مرورگرهای موبایل، دسترسی به میکروفون نیازمند HTTPS است.)";
                            }
                            alert(msg);
                        } else {
                            self._startRecognitionInstance();
                        }
                        return;
                    }

                    console.warn("[aiSpeakingSpeech] Preferred getUserMedia failed, retrying with basic { audio: true }:", err);
                    getUserMediaFn({ audio: true }).then(handleStreamAcquired).catch(function(finalErr) {
                        console.error("[aiSpeakingSpeech] getUserMedia final error:", finalErr);
                        self.isRecording = false;
                        self._userWantsRecording = false;
                        if (finalErr.name === 'NotAllowedError' || finalErr.name === 'PermissionDeniedError') {
                            var msg = "دسترسی به میکروفون رد شد. لطفاً دسترسی به میکروفون را در تنظیمات مرورگر فعال کنید.";
                            if (!self._checkSecureContext()) {
                                msg += "\n\n(نکته: در مرورگرهای موبایل و شبکه محلی، دسترسی به میکروفون نیازمند HTTPS است.)";
                            }
                            alert(msg);
                        } else {
                            self._startRecognitionInstance();
                        }
                    });
                });
            },

            drainPcmChunks: function() {
                if (!this._pcmChunkQueue || this._pcmChunkQueue.length === 0) {
                    return "";
                }
                var drained = this._pcmChunkQueue.splice(0, this._pcmChunkQueue.length);
                return drained.join("|");
            },

            hasVoiceActivity: function() {
                var active = this._hasVoiceActivity;
                this._hasVoiceActivity = false;
                return active;
            },

            _startRecognitionInstance: function() {
                if (!this._userWantsRecording) {
                    return;
                }

                var SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!SpeechRec) return;

                if (this.recognition) {
                    try {
                        this.recognition.onend = null;
                        this.recognition.onerror = null;
                        this.recognition.onresult = null;
                        this.recognition.abort();
                    } catch(e) {}
                    this.recognition = null;
                }

                var self = this;
                var recognition = new SpeechRec();
                this.recognition = recognition;

                recognition.lang = 'en-US';
                recognition.continuous = !this._isIOS;
                recognition.interimResults = true;
                recognition.maxAlternatives = 1;

                recognition.onresult = function(event) {
                    self._consecutiveErrors = 0;
                    var sessionText = '';
                    for (var i = 0; i < event.results.length; ++i) {
                        var chunk = (event.results[i][0].transcript || '').trim();
                        if (chunk) {
                            sessionText += (sessionText ? ' ' : '') + chunk;

                // Collect textboxes and mic buttons from a11y trees and shadow roots
                var textboxes = [];
                var micButtons = [];

                function checkA11yRoot(root) {
                    if (!root) return;
                    var tbs = root.querySelectorAll ? root.querySelectorAll('[role="textbox"]') : [];
                    for (var i = 0; i < tbs.length; i++) textboxes.push(tbs[i]);

                    var buttons = root.querySelectorAll ? root.querySelectorAll('[role="button"]') : [];
                    for (var j = 0; j < buttons.length; j++) {
                        var bText = (buttons[j].innerText || buttons[j].textContent || "").trim();
                        if (bText.indexOf("میکروفون") !== -1 || bText.indexOf("اجازه") !== -1 || bText.indexOf("صوتی") !== -1) {
                            micButtons.push(buttons[j]);
                        }
                    }
                }

                var roots = getAllShadowRoots();
                for (var rIdx = 0; rIdx < roots.length; rIdx++) {
                    var a11y = roots[rIdx].querySelector('#cmp_a11y_root');
                    if (a11y) checkA11yRoot(a11y);
                }

                // Check hit on Mic permission buttons to trigger synchronous getUserMedia on iOS Chrome / Safari
                for (var m = 0; m < micButtons.length; m++) {
                    var mb = micButtons[m];
                    var mRect = mb.getBoundingClientRect();
                    if (x >= mRect.left && x <= mRect.right && y >= mRect.top && y <= mRect.bottom) {
                        try {
                            if (window.aiSpeakingPermission && typeof window.aiSpeakingPermission.request === 'function') {
                                window.aiSpeakingPermission.request();
                            }
                        } catch(err) {
                            console.warn("[onNativeTouch] mic prompt trigger error:", err);
                        }
                        break;
                    }
                }

                // Check hit on textboxes
                var hitTextbox = null;
                for (var i = 0; i < textboxes.length; i++) {
                    var tb = textboxes[i];
                    var r = tb.getBoundingClientRect();
                    if (x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) {
                        hitTextbox = tb;
                        break;
                    }
                }

                if (hitTextbox) {
                    // Check if an elevated backing input is already available in any shadow root
                    var backingInput = null;
                    for (var s = 0; s < roots.length; s++) {
                        var found = roots[s].querySelector('input:not(#cmp_ios_keyboard_proxy), textarea:not(#cmp_ios_keyboard_proxy)');
                        if (found) { backingInput = found; break; }
                    }

                    if (backingInput) {
                        elevateBackingInput(backingInput);
                        try { backingInput.focus(); } catch(e) {}
                    } else if (proxyInput) {
                        try { proxyInput.focus(); } catch(e) {}
                    }
                }
            }

            window.addEventListener('touchstart', onNativeTouch, { capture: true, passive: true });
            window.addEventListener('touchend', onNativeTouch, { capture: true, passive: true });
        })();
    </script>
