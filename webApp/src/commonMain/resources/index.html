<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <base href="/app/">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
        <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
        <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png">
        <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16x16.png">
        <link rel="manifest" href="./manifest.json">
        <title>AI Speaking Plus</title>

        <!-- Preload Essential Fonts to Prevent Tofu (□) & FOUT During Initialization -->
        <link rel="preload" href="./composeResources/ir.aispeaking.sharedui/font/vazir.ttf" as="font" type="font/ttf" crossorigin>
        <link rel="preload" href="./composeResources/ir.aispeaking.sharedui/font/vazir_bold.ttf" as="font" type="font/ttf" crossorigin>
        <link rel="preload" href="./composeResources/ir.aispeaking.sharedui/font/poppins_regular.ttf" as="font" type="font/ttf" crossorigin>
        <link rel="preload" href="./composeResources/ir.aispeaking.sharedui/font/poppins_bold.ttf" as="font" type="font/ttf" crossorigin>

        <style>
            @font-face {
                font-family: 'Vazirmatn';
                src: url('./composeResources/ir.aispeaking.sharedui/font/vazir.ttf') format('truetype');
                font-weight: 400;
                font-style: normal;
                font-display: swap;
            }
            @font-face {
                font-family: 'Vazirmatn';
                src: url('./composeResources/ir.aispeaking.sharedui/font/vazir_bold.ttf') format('truetype');
                font-weight: 700;
                font-style: normal;
                font-display: swap;
            }

            html,
            body {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                margin: 0;
                padding: 0;
                overflow: hidden;
                background-color: #080A10;
            }

            /* Dedicated Branded App Loading Screen */
            #appLoadingContainer {
                position: fixed;
                inset: 0;
                width: 100%;
                height: 100%;
                background: radial-gradient(circle at 50% 38%, #181c2e 0%, #0d1120 55%, #06080e 100%);
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                z-index: 99990;
                font-family: 'Vazirmatn', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
                color: #ffffff;
                user-select: none;
                -webkit-user-select: none;
                transition: opacity 0.45s cubic-bezier(0.4, 0, 0.2, 1), transform 0.45s cubic-bezier(0.4, 0, 0.2, 1);
                will-change: opacity, transform;
            }

            #appLoadingContainer.fade-out {
                opacity: 0;
                transform: scale(1.02);
                pointer-events: none;
            }

            .loader-box {
                display: flex;
                flex-direction: column;
                align-items: center;
                text-align: center;
                max-width: 380px;
                padding: 24px;
            }

            .loader-logo-wrap {
                position: relative;
                width: 88px;
                height: 88px;
                display: flex;
                align-items: center;
                justify-content: center;
                animation: floatLogo 3.2s ease-in-out infinite;
            }

            .loader-logo-halo {
                position: absolute;
                inset: -14px;
                background: radial-gradient(circle, rgba(56, 189, 248, 0.45) 0%, rgba(99, 102, 241, 0.2) 50%, transparent 70%);
                border-radius: 50%;
                animation: pulseHalo 2.4s ease-in-out infinite;
                pointer-events: none;
            }

            .loader-logo-img {
                position: relative;
                width: 84px;
                height: 84px;
                border-radius: 24px;
                box-shadow: 0 16px 36px -6px rgba(0, 0, 0, 0.65), 0 0 0 1.5px rgba(255, 255, 255, 0.16);
                display: block;
                object-fit: cover;
                background: #0f172a;
            }

            .loader-title {
                margin-top: 22px;
                font-size: 22px;
                font-weight: 800;
                letter-spacing: -0.3px;
                background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
                text-shadow: 0 4px 18px rgba(0, 0, 0, 0.4);
            }

            .loader-subtitle {
                margin-top: 6px;
                font-size: 13.5px;
                font-weight: 500;
                color: #94a3b8;
                direction: rtl;
                line-height: 1.5;
            }

            /* Voice Equalizer Wave Animation (AI Speaking Theme) */
            .loader-wave-container {
                margin-top: 26px;
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 5px;
                height: 28px;
            }

            .wave-bar {
                width: 3.5px;
                height: 8px;
                background: linear-gradient(180deg, #38bdf8 0%, #818cf8 100%);
                border-radius: 999px;
                animation: waveBounce 1.1s ease-in-out infinite alternate;
                box-shadow: 0 0 8px rgba(56, 189, 248, 0.35);
            }

            .wave-bar:nth-child(1) { animation-delay: 0.0s; height: 10px; }
            .wave-bar:nth-child(2) { animation-delay: 0.18s; height: 18px; }
            .wave-bar:nth-child(3) { animation-delay: 0.36s; height: 26px; }
            .wave-bar:nth-child(4) { animation-delay: 0.54s; height: 16px; }
            .wave-bar:nth-child(5) { animation-delay: 0.72s; height: 10px; }

            .loader-status {
                margin-top: 14px;
                font-size: 12px;
                color: #64748b;
                direction: rtl;
                font-weight: 500;
                letter-spacing: -0.2px;
            }

            @keyframes floatLogo {
                0%, 100% { transform: translateY(0px); }
                50% { transform: translateY(-7px); }
            }

            @keyframes pulseHalo {
                0%, 100% { transform: scale(0.95); opacity: 0.35; }
                50% { transform: scale(1.2); opacity: 0.7; }
            }

            @keyframes waveBounce {
                0% { transform: scaleY(0.4); opacity: 0.45; }
                100% { transform: scaleY(1.4); opacity: 1; }
            }
        </style>
    </head>
    <body>
        <div id="appLoadingContainer">
            <div class="loader-box">
                <div class="loader-logo-wrap">
                    <div class="loader-logo-halo"></div>
                    <img src="./apple-touch-icon.png" class="loader-logo-img" alt="AI Speaking Plus">
                </div>
                <div class="loader-title">AI Speaking Plus</div>
                <div class="loader-subtitle">ماجراجویی مکالمه انگلیسی با هوش مصنوعی</div>
                <div class="loader-wave-container">
                    <span class="wave-bar"></span>
                    <span class="wave-bar"></span>
                    <span class="wave-bar"></span>
                    <span class="wave-bar"></span>
                    <span class="wave-bar"></span>
                </div>
                <div class="loader-status">در حال آماده‌سازی محیط گفتگو...</div>
            </div>
        </div>
    <script>
        window.aiSpeakingRouter = {
            _popCounter: 0,
            init: function() {
                var self = this;
                window.addEventListener('popstate', function(e) {
                    self._popCounter++;
                });
            },
            getPopCounter: function() {
                return this._popCounter;
            },
            getCurrentPath: function() {
                return window.location.pathname;
            },
            getCurrentSearch: function() {
                return window.location.search || "";
            },
            getHash: function() {
                return window.location.hash || "";
            },
            pushUrl: function(url) {
                var cur = window.location.pathname + (window.location.search || "");
                if (cur !== url) {
                    window.history.pushState({ path: url }, "", url);
                }
            },
            replaceUrl: function(url) {
                var cur = window.location.pathname + (window.location.search || "");
                if (cur !== url) {
                    window.history.replaceState({ path: url }, "", url);
                }
            }
        };
        window.aiSpeakingRouter.init();

        window.aiSpeakingVideo = {
            overlay: null,
            video: null,
            _hasEnded: false,
            _hasSkipped: false,
            _isPlaying: false,

            show: function(src) {
                this._hasEnded = false;
                this._hasSkipped = false;
                this._isPlaying = false;

                if (!this.overlay) {
                    this._createDom();
                }

                var fullUrl = (src && (src.startsWith("http://") || src.startsWith("https://")))
                    ? src
                    : (window.location.origin + (src.startsWith("/") ? src : "/" + src));

                this.video.src = fullUrl;
                this.overlay.style.display = "flex";
                this.overlay.style.opacity = "1";
                this._updateMuteButton(false);

                var self = this;
                var playPromise = this.video.play();
                if (playPromise !== undefined) {
                    playPromise.then(function() {
                        self._isPlaying = true;
                    }).catch(function(err) {
                        console.warn("Autoplay with sound prevented, muting to start playback:", err);
                        self.video.muted = true;
                        self._updateMuteButton(true);
                        self.video.play().then(function() {
                            self._isPlaying = true;
                            self._showUnmuteHint();
                        }).catch(function(e) {
                            console.error("Video play failed:", e);
                        });
                    });
                }
            },

            hide: function() {
                if (this.video) {
                    try { this.video.pause(); } catch(e){}
                }
                if (this.overlay) {
                    this.overlay.style.display = "none";
                }
                this._isPlaying = false;
            },

            consumeEnded: function() {
                if (this._hasEnded) {
                    this._hasEnded = false;
                    return true;
                }
                return false;
            },

            consumeSkipped: function() {
                if (this._hasSkipped) {
                    this._hasSkipped = false;
                    return true;
                }
                return false;
            },

            _createDom: function() {
                var self = this;
                var overlay = document.createElement("div");
                overlay.id = "aiSpeakingVideoOverlay";
                overlay.style.position = "fixed";
                overlay.style.top = "0";
                overlay.style.left = "0";
                overlay.style.width = "100%";
                overlay.style.height = "100%";
                overlay.style.backgroundColor = "rgba(0,0,0,0.92)";
                overlay.style.zIndex = "99999";
                overlay.style.display = "none";
                overlay.style.flexDirection = "column";
                overlay.style.alignItems = "center";
                overlay.style.justifyContent = "center";
                overlay.style.transition = "opacity 0.3s ease";
                overlay.style.overflow = "hidden";

                var playerBox = document.createElement("div");
                playerBox.style.position = "relative";
                playerBox.style.width = "100%";
                playerBox.style.maxWidth = "430px";
                playerBox.style.height = "100%";
                playerBox.style.maxHeight = "900px";
                playerBox.style.display = "flex";
                playerBox.style.flexDirection = "column";
                playerBox.style.justifyContent = "center";
                playerBox.style.alignItems = "center";
                playerBox.style.backgroundColor = "#000";
                playerBox.style.borderRadius = (window.innerWidth > 560) ? "16px" : "0";
                playerBox.style.boxShadow = "0 25px 50px -12px rgba(0, 0, 0, 0.7)";
                playerBox.style.overflow = "hidden";

                var video = document.createElement("video");
                video.setAttribute("playsinline", "");
                video.setAttribute("webkit-playsinline", "");
                video.setAttribute("preload", "auto");
                video.style.width = "100%";
                video.style.height = "100%";
                video.style.objectFit = "cover";
                video.style.backgroundColor = "#000";

                // Top Controls Bar
                var topBar = document.createElement("div");
                topBar.style.position = "absolute";
                topBar.style.top = "16px";
                topBar.style.left = "16px";
                topBar.style.right = "16px";
                topBar.style.display = "flex";
                topBar.style.justifyContent = "space-between";
                topBar.style.alignItems = "center";
                topBar.style.zIndex = "10";
                topBar.style.direction = "rtl";

                // Skip Button
                var skipBtn = document.createElement("button");
                skipBtn.innerHTML = "رد کردن ›";
                skipBtn.style.padding = "8px 18px";
                skipBtn.style.backgroundColor = "rgba(255, 255, 255, 0.2)";
                skipBtn.style.backdropFilter = "blur(12px)";
                skipBtn.style.webkitBackdropFilter = "blur(12px)";
                skipBtn.style.border = "1px solid rgba(255, 255, 255, 0.35)";
                skipBtn.style.borderRadius = "20px";
                skipBtn.style.color = "#ffffff";
                skipBtn.style.fontSize = "13px";
                skipBtn.style.fontWeight = "600";
                skipBtn.style.fontFamily = "Vazirmatn, system-ui, sans-serif";
                skipBtn.style.cursor = "pointer";
                skipBtn.style.boxShadow = "0 4px 12px rgba(0,0,0,0.3)";
                skipBtn.onclick = function(e) {
                    e.stopPropagation();
                    self._hasSkipped = true;
                    self.hide();
                };

                // Sound Toggle Button
                var soundBtn = document.createElement("button");
                soundBtn.id = "videoMuteBtn";
                soundBtn.innerHTML = "🔊";
                soundBtn.style.width = "38px";
                soundBtn.style.height = "38px";
                soundBtn.style.backgroundColor = "rgba(255, 255, 255, 0.2)";
                soundBtn.style.backdropFilter = "blur(12px)";
                soundBtn.style.webkitBackdropFilter = "blur(12px)";
                soundBtn.style.border = "1px solid rgba(255, 255, 255, 0.35)";
                soundBtn.style.borderRadius = "50%";
                soundBtn.style.color = "#ffffff";
                soundBtn.style.fontSize = "16px";
                soundBtn.style.cursor = "pointer";
                soundBtn.style.display = "flex";
                soundBtn.style.alignItems = "center";
                soundBtn.style.justifyContent = "center";
                soundBtn.onclick = function(e) {
                    e.stopPropagation();
                    self.video.muted = !self.video.muted;
                    self._updateMuteButton(self.video.muted);
                    self._hideUnmuteHint();
                };

                topBar.appendChild(skipBtn);
                topBar.appendChild(soundBtn);

                // Unmute hint
                var unmuteHint = document.createElement("div");
                unmuteHint.id = "videoUnmuteHint";
                unmuteHint.innerHTML = "🔊 برای شنیدن صدا لمس کنید";
                unmuteHint.style.position = "absolute";
                unmuteHint.style.bottom = "24px";
                unmuteHint.style.backgroundColor = "rgba(30, 41, 59, 0.85)";
                unmuteHint.style.backdropFilter = "blur(8px)";
                unmuteHint.style.border = "1px solid rgba(59, 130, 246, 0.5)";
                unmuteHint.style.color = "#60A5FA";
                unmuteHint.style.padding = "8px 16px";
                unmuteHint.style.borderRadius = "20px";
                unmuteHint.style.fontSize = "13px";
                unmuteHint.style.fontWeight = "bold";
                unmuteHint.style.fontFamily = "Vazirmatn, sans-serif";
                unmuteHint.style.cursor = "pointer";
                unmuteHint.style.display = "none";
                unmuteHint.style.zIndex = "10";
                unmuteHint.onclick = function(e) {
                    e.stopPropagation();
                    self.video.muted = false;
                    self._updateMuteButton(false);
                    self._hideUnmuteHint();
                };

                video.onclick = function() {
                    if (video.muted) {
                        video.muted = false;
                        self._updateMuteButton(false);
                        self._hideUnmuteHint();
                    } else if (video.paused) {
                        video.play();
                    } else {
                        video.pause();
                    }
                };

                video.onended = function() {
                    self._hasEnded = true;
                    self.hide();
                };

                playerBox.appendChild(video);
                playerBox.appendChild(topBar);
                playerBox.appendChild(unmuteHint);
                overlay.appendChild(playerBox);
                document.body.appendChild(overlay);

                this.overlay = overlay;
                this.video = video;
                this.muteBtn = soundBtn;
                this.unmuteHint = unmuteHint;
            },

            _updateMuteButton: function(muted) {
                if (this.muteBtn) {
                    this.muteBtn.innerHTML = muted ? "🔇" : "🔊";
                }
            },

            _showUnmuteHint: function() {
                if (this.unmuteHint) {
                    this.unmuteHint.style.display = "block";
                }
            },

            _hideUnmuteHint: function() {
                if (this.unmuteHint) {
                    this.unmuteHint.style.display = "none";
                }
            }
        };

        window._isAudioPlaying = false;
        window._aiSpeakingAudioPool = window._aiSpeakingAudioPool || {};

        // iOS Safari Audio Autoplay & Web Audio Unlocker
        var SILENT_AUDIO_WAV = "data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=";
        var _unlockedAudio = null;
        var _isAudioUnlocked = false;

        function getOrCreateAudioElement() {
            if (!_unlockedAudio) {
                _unlockedAudio = new Audio();
                _unlockedAudio.setAttribute("playsinline", "");
                _unlockedAudio.setAttribute("webkit-playsinline", "");
                _unlockedAudio.preload = "auto";
            }
            return _unlockedAudio;
        }

        function unlockAudioContextAndElement() {
            var audio = getOrCreateAudioElement();
            if (!_isAudioUnlocked) {
                audio.src = SILENT_AUDIO_WAV;
                var p = audio.play();
                if (p !== undefined) {
                    p.then(function() {
                        _isAudioUnlocked = true;
                        audio.pause();
                        audio.currentTime = 0;
                    }).catch(function() {});
                }
            }
            try {
                if (window.aiSpeakingSpeech && window.aiSpeakingSpeech.audioContext && window.aiSpeakingSpeech.audioContext.state === 'suspended') {
                    window.aiSpeakingSpeech.audioContext.resume().catch(function(){});
                }
                if (window._aiSpeakingAudioCtx && window._aiSpeakingAudioCtx.state === 'suspended') {
                    window._aiSpeakingAudioCtx.resume().catch(function(){});
                }
            } catch(e) {}
        }

        // Attach unlock to all user gesture events on the document
        ['touchstart', 'touchend', 'click', 'mousedown', 'keydown'].forEach(function(evt) {
            document.addEventListener(evt, unlockAudioContextAndElement, { passive: true, capture: true });
        });

        window.aiSpeakingAudio = {
            audio: null,
            _currentUrl: null,

            unlock: function() {
                unlockAudioContextAndElement();
            },

            isPlaying: function() {
                var audio = getOrCreateAudioElement();
                var isDomPlaying = !!(audio && !audio.paused && !audio.ended && audio.currentTime > 0);
                return window._isAudioPlaying === true || isDomPlaying;
            },

            preload: function(url) {
                if (!url) return;
                var fullUrl = (url.startsWith("http://") || url.startsWith("https://")) ? url : (window.location.origin + (url.startsWith("/") ? url : "/" + url));
                if (!window._aiSpeakingAudioPool[fullUrl]) {
                    try {
                        var a = new Audio();
                        a.preload = "auto";
                        a.src = fullUrl;
                        window._aiSpeakingAudioPool[fullUrl] = a;
                    } catch(e) {
                        console.warn("[aiSpeakingAudio] preload error:", e);
                    }
                }
            },

            play: function(url) {
                if (!url) {
                    this.stop();
                    return;
                }

                unlockAudioContextAndElement();

                var fullUrl = (url.startsWith("http://") || url.startsWith("https://")) ? url : (window.location.origin + (url.startsWith("/") ? url : "/" + url));
                var self = this;
                self._currentUrl = fullUrl;

                var audio = getOrCreateAudioElement();
                self.audio = audio;

                var finish = function() {
                    if (self._currentUrl === fullUrl) {
                        window._isAudioPlaying = false;
                    }
                };

                audio.onended = finish;
                audio.onerror = function(e) {
                    console.warn("[aiSpeakingAudio] Playback error:", e);
                    finish();
                };

                // Check if already pointed to this exact media URL (replay scenario)
                var isSame = (audio.src === fullUrl || audio.currentSrc === fullUrl || (audio.src && audio.src.indexOf(url) !== -1));

                if (isSame && audio.duration > 0 && !isNaN(audio.duration)) {
                    // Safe replay: rewind to 0 and trigger play without calling .load()
                    try {
                        audio.pause();
                        audio.currentTime = 0;
                    } catch(e) {}
                    window._isAudioPlaying = true;
                    var playPromise = audio.play();
                    if (playPromise !== undefined) {
                        playPromise.then(function() {
                            window._isAudioPlaying = true;
                        }).catch(function(err) {
                            if (err && err.name === 'AbortError') {
                                setTimeout(function() {
                                    if (self._currentUrl === fullUrl) {
                                        audio.play().then(function() {
                                            window._isAudioPlaying = true;
                                        }).catch(finish);
                                    }
                                }, 50);
                            } else {
                                console.warn("[aiSpeakingAudio] Replay error:", err);
                                finish();
                            }
                        });
                    }
                } else {
                    // Fresh or different URL: assign src and play (do NOT call .load() as it triggers AbortError on iOS)
                    try {
                        audio.pause();
                        audio.currentTime = 0;
                    } catch(e) {}
                    audio.src = fullUrl;
                    window._isAudioPlaying = true;
                    var playPromise = audio.play();
                    if (playPromise !== undefined) {
                        playPromise.then(function() {
                            window._isAudioPlaying = true;
                        }).catch(function(err) {
                            if (err && err.name === 'AbortError') {
                                setTimeout(function() {
                                    if (self._currentUrl === fullUrl) {
                                        audio.play().then(function() {
                                            window._isAudioPlaying = true;
                                        }).catch(finish);
                                    }
                                }, 50);
                            } else {
                                console.warn("[aiSpeakingAudio] Play error:", err);
                                finish();
                            }
                        });
                    }
                }
            },

            stop: function() {
                window._isAudioPlaying = false;
                this._currentUrl = null;
                var audio = getOrCreateAudioElement();
                try {
                    audio.pause();
                    audio.currentTime = 0;
                } catch(e){}
            }
        };

        window.aiSpeakingSpeech = {
            recognition: null,
            mediaStream: null,
            audioContext: null,
            audioInputSource: null,
            audioProcessor: null,
            _pcmChunkQueue: [],
            _fallbackPcmChunks: [],
            _hasVoiceActivity: false,
            _lastVoiceActivityTime: 0,
            isRecording: false,
            _userWantsRecording: false,
            _micPermissionGranted: false,
            _restartTimeout: null,
            _accumulatedTranscript: "",
            _currentSessionFinalTranscript: "",
            _currentSessionTranscript: "",
            transcript: "",
            _consecutiveErrors: 0,
            _isMobile: false,
            _isIOS: false,
            _usingFallback: false,

            _initDevice: function() {
                var ua = navigator.userAgent || '';
                this._isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(ua) ||
                                 (navigator.userAgentData && navigator.userAgentData.mobile) ||
                                 (navigator.maxTouchPoints && navigator.maxTouchPoints > 1);
                this._isIOS = /iPhone|iPad|iPod/i.test(ua) ||
                              (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
            },

            _checkSecureContext: function() {
                var isLocal = window.location.hostname === 'localhost' ||
                              window.location.hostname === '127.0.0.1' ||
                              window.location.hostname === '0.0.0.0' ||
                              window.location.hostname === '[::1]' ||
                              window.location.hostname.endsWith('.localhost');
                var isSecure = window.isSecureContext || window.location.protocol === 'https:' || isLocal;
                if (!isSecure) {
                    console.warn("[aiSpeakingSpeech] Insecure origin detected (" + window.location.origin + "). " +
                        "Microphone and Web Speech API will be blocked by browsers on non-localhost HTTP. " +
                        "Use HTTPS (or localhost) to enable audio recording.");
                }
                return isSecure;
            },

            _downsampleBuffer: function(buffer, sourceRate, targetRate) {
                if (sourceRate === targetRate || !buffer || buffer.length === 0) return buffer;
                var ratio = sourceRate / targetRate;
                var newLength = Math.round(buffer.length / ratio);
                var result = new Float32Array(newLength);
                var offsetResult = 0;
                var offsetBuffer = 0;
                while (offsetResult < result.length) {
                    var nextOffsetBuffer = Math.round((offsetResult + 1) * ratio);
                    var accum = 0, count = 0;
                    for (var i = offsetBuffer; i < nextOffsetBuffer && i < buffer.length; i++) {
                        accum += buffer[i];
                        count++;

                var body = payload.notification?.body || payload.data?.body || payload.data?.message || '';
                var data = payload.data || {};

                if (Notification.permission === 'granted') {
                    try {
                        var n = new Notification(title, {
                            body: body,
                            icon: payload.notification?.icon || data.icon || './android-chrome-192x192.png',
                            data: data
                        });
                        var self = this;
                        n.onclick = function() {
                            n.close();
                            window.focus();
                            var screen = (data.screen || '').toLowerCase().trim();
                            if (!screen || screen === 'none') {
                                if (!data.url && !data.stage_id && !data.stageId) {
                                    return;
                                }
                            }
                            if (data.url) {
                                self.navigateToUrl(data.url);
                            } else if (data.stage_id || data.stageId) {
                                var stageId = data.stage_id || data.stageId;
                                window.location.hash = 'chat?stageId=' + encodeURIComponent(stageId);
                            } else if (screen) {
                                if (screen === 'profile') window.location.hash = 'profile';
                                else if (screen === 'subscription' || screen === 'sub') window.location.hash = 'subscription';
                                else if (screen === 'stages' || screen === 'stages_list') window.location.hash = 'stages';
                                else if (screen === 'login') window.location.hash = 'login';
                                else window.location.hash = 'main';
                            }
                        };
                    } catch(e) {
                        console.warn('[FCM Web] Foreground notification presentation failed:', e);
                    }
                }
            }
        };

        // Initialize when window finishes loading
        window.addEventListener('load', function() {
            window.aiSpeakingPush.init();
        });

        // Request permission on first user gesture (click/tap) if still in 'default' state
        var requestNotificationOnGesture = function() {
            if (window.Notification && Notification.permission === 'default') {
                window.aiSpeakingPush.requestPermissionAndToken();
            }
            window.removeEventListener('click', requestNotificationOnGesture);
            window.removeEventListener('touchend', requestNotificationOnGesture);
        };
        window.addEventListener('click', requestNotificationOnGesture, { once: true });
        window.addEventListener('touchend', requestNotificationOnGesture, { once: true });
        // Compose Web Keyboard Accessibility & Tab Navigation Support (BUG-06)
        (function() {
            var INTERACTIVE_ROLES = new Set([
                'button',
                'textbox',
                'checkbox',
                'switch',
                'link',
                'combobox',
                'menuitem',
                'tab'
            ]);

            function updateInteractiveNode(el) {
                var role = el.getAttribute('role');
                var isHidden = el.getAttribute('aria-hidden') === 'true';
                var isDisabled = el.getAttribute('aria-disabled') === 'true';

                if (role && INTERACTIVE_ROLES.has(role) && !isHidden) {
                    if (isDisabled) {
                        el.setAttribute('tabindex', '-1');
                    } else if (el.getAttribute('tabindex') !== '0') {
                        el.setAttribute('tabindex', '0');
                    }

                    if (!el._hasA11yKeyHandler) {
                        el._hasA11yKeyHandler = true;
                        el.addEventListener('keydown', function(evt) {
                            if (evt.key === 'Enter' || evt.key === ' ') {
                                if (el.getAttribute('role') === 'button' || el.getAttribute('role') === 'checkbox') {
                                    evt.preventDefault();
                                    el.click();
                                }
                            }
                        });
                    }
                } else if (el.getAttribute('tabindex') === '0' && (!role || !INTERACTIVE_ROLES.has(role))) {
                    el.removeAttribute('tabindex');
                }
            }

            function processA11yTree(root) {
                if (!root) return;
                var candidates = root.querySelectorAll ? root.querySelectorAll('[role]') : [];
                for (var i = 0; i < candidates.length; i++) {
                    updateInteractiveNode(candidates[i]);
                }
            }

            function attachObserverToA11yRoot(a11yRoot) {
                if (!a11yRoot || a11yRoot._a11yObserverAttached) return;
                a11yRoot._a11yObserverAttached = true;
                processA11yTree(a11yRoot);

                var observer = new MutationObserver(function(mutations) {
                    for (var i = 0; i < mutations.length; i++) {
                        var mutation = mutations[i];
                        if (mutation.type === 'childList') {
                            for (var j = 0; j < mutation.addedNodes.length; j++) {
                                var node = mutation.addedNodes[j];
                                if (node.nodeType === 1) {
                                    if (node.hasAttribute('role')) updateInteractiveNode(node);
                                    processA11yTree(node);
                                }
                            }
                        } else if (mutation.type === 'attributes') {
                            if (mutation.target && mutation.target.nodeType === 1) {
                                updateInteractiveNode(mutation.target);
                            }
                        }

                });

                observer.observe(a11yRoot, {
                    childList: true,
                    subtree: true,
                    attributes: true,
                    attributeFilter: ['role', 'aria-hidden', 'aria-disabled']
                });
            }

            function scanForA11yRoots() {
                var root = document.getElementById('cmp_a11y_root');
                if (root) attachObserverToA11yRoot(root);

                var allEls = document.querySelectorAll('*');
                for (var i = 0; i < allEls.length; i++) {
                    var shadow = allEls[i].shadowRoot;
                    if (shadow) {
                        var shadowRoot = shadow.querySelector('#cmp_a11y_root');
                        if (shadowRoot) attachObserverToA11yRoot(shadowRoot);
                    }

            var origAttachShadow = Element.prototype.attachShadow;
            Element.prototype.attachShadow = function(init) {

                    var a11y = shadow.querySelector('#cmp_a11y_root');
                    if (a11y) attachObserverToA11yRoot(a11y);
                });
                shadowObserver.observe(shadow, { childList: true, subtree: true });
                return shadow;
            };

            var bodyObserver = new MutationObserver(scanForA11yRoots);
            if (document.body) {
                bodyObserver.observe(document.body, { childList: true, subtree: true });
                scanForA11yRoots();
            } else {
                window.addEventListener('DOMContentLoaded', function() {
                    bodyObserver.observe(document.body, { childList: true, subtree: true });
                    scanForA11yRoots();
                });
            }

            var scanCount = 0;
            var scanInterval = setInterval(function() {
                scanForA11yRoots();
                scanCount++;
                if (scanCount > 20) clearInterval(scanInterval);
            }, 500);
        })();

        // iOS WebKit (Safari & Chrome on iOS) Virtual Keyboard & Hardware Permission Bridge (CMP-10858 / CMP-8013)
        (function() {
            var ua = navigator.userAgent || '';
            var isIOS = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
            if (!isIOS) return;

            // 1. Maintain persistent transparent proxy input
            var proxyInput = null;
            function ensureProxyInput() {
                proxyInput = document.getElementById('cmp_ios_keyboard_proxy');
                if (!proxyInput) {
                    proxyInput = document.createElement('textarea');
                    proxyInput.id = 'cmp_ios_keyboard_proxy';
                    proxyInput.setAttribute('autocomplete', 'off');
                    proxyInput.setAttribute('autocorrect', 'off');
                    proxyInput.setAttribute('autocapitalize', 'off');
                    proxyInput.setAttribute('spellcheck', 'false');
                    proxyInput.setAttribute('inputmode', 'text');
                    proxyInput.setAttribute('enterkeyhint', 'done');
                    proxyInput.setAttribute('tabindex', '-1');
                    // 16px font-size prevents iOS Safari/WebKit auto-zoom on focus
                    proxyInput.style.cssText = 'position: fixed; bottom: 12px; left: 20px; width: 1px; height: 1px; opacity: 0.001; font-size: 16px; border: none; outline: none; background: transparent; pointer-events: none; z-index: 99998;';
                }
                if (!proxyInput.isConnected && document.body) {
                    document.body.appendChild(proxyInput);
                }
                return proxyInput;
            }
            ensureProxyInput();

            // 2. Deep collector for all active ShadowRoots
            function getAllShadowRoots() {
                var roots = [];
                function traverse(el) {
                    if (!el) return;
                    if (el.shadowRoot && roots.indexOf(el.shadowRoot) === -1) {
                        roots.push(el.shadowRoot);
                        traverse(el.shadowRoot);
                    }
                    var children = el.children || [];
                    for (var i = 0; i < children.length; i++) {
                        traverse(children[i]);
                    }
                }
                traverse(document.body);
                return roots;
            }

            // 3. Helper to elevate Compose backing inputs above canvas
            function elevateBackingInput(el) {
                if (!el) return;
                var tag = (el.tagName || '').toUpperCase();
                if (tag === 'INPUT' || tag === 'TEXTAREA') {
                    if (el.id === 'cmp_ios_keyboard_proxy') return;
                    el.style.setProperty('position', 'fixed', 'important');
                    el.style.setProperty('bottom', '12px', 'important');
                    el.style.setProperty('left', '20px', 'important');
                    el.style.setProperty('top', 'auto', 'important');
                    el.style.setProperty('z-index', '99999', 'important');
                    el.style.setProperty('pointer-events', 'auto', 'important');
                    el.style.setProperty('opacity', '0.001', 'important');
                    el.style.setProperty('font-size', '16px', 'important');
                    el.style.setProperty('-webkit-user-select', 'text', 'important');
                    el.style.setProperty('user-select', 'text', 'important');
                    el.style.setProperty('caret-color', 'transparent', 'important');

                    // If proxy input was focused during touchstart, smoothly transfer focus to Compose backing input
                    var proxy = ensureProxyInput();
                    if (document.activeElement === proxy || (proxy && proxy.matches && proxy.matches(':focus'))) {
                        setTimeout(function() {
                            try { el.focus(); } catch(e) {}
                        }, 10);
                    }
                }

            // 4. MutationObserver to watch shadow roots and body for inputs
            var inputObserver = new MutationObserver(function(mutations) {
                ensureProxyInput();
                for (var i = 0; i < mutations.length; i++) {
                    var m = mutations[i];
                    for (var j = 0; j < m.addedNodes.length; j++) {
                        var node = m.addedNodes[j];
                        if (node.nodeType === 1) {
                            elevateBackingInput(node);
                            if (node.querySelectorAll) {
                                var children = node.querySelectorAll('input, textarea');
                                for (var k = 0; k < children.length; k++) {
                                    elevateBackingInput(children[k]);
                                }
                            }
                        }
                    }
                }
            });

            function scanAndObserveInputs() {
                ensureProxyInput();
                if (document.body) inputObserver.observe(document.body, { childList: true, subtree: true });
                var roots = getAllShadowRoots();
                for (var i = 0; i < roots.length; i++) {
                    var shadow = roots[i];
                    try { inputObserver.observe(shadow, { childList: true, subtree: true }); } catch(e) {}
                    var inputs = shadow.querySelectorAll('input, textarea');
                    for (var j = 0; j < inputs.length; j++) {
                        elevateBackingInput(inputs[j]);
                    }
                }

            var prevAttachShadow = Element.prototype.attachShadow;
            Element.prototype.attachShadow = function() {
                var shadow = prevAttachShadow.apply(this, arguments);
                try { inputObserver.observe(shadow, { childList: true, subtree: true }); } catch(e) {}
                setTimeout(scanAndObserveInputs, 50);
                return shadow;

                window.addEventListener('DOMContentLoaded', scanAndObserveInputs);
            } else {
                scanAndObserveInputs();
            }

            // 5. Synchronous touch event interception for Keyboard & Mic Permission
            function onNativeTouch(e) {
                ensureProxyInput();
                if (!e.touches && !e.changedTouches) return;
                var touch = (e.touches && e.touches.length > 0) ? e.touches[0] : e.changedTouches[0];
                if (!touch) return;
                var x = touch.clientX;
                var y = touch.clientY;

                // Collect textboxes and mic buttons from a11y trees and shadow roots
                var textboxes = [];
                var micButtons = [];

                function checkA11yRoot(root) {
                    if (!root) return;
                    var tbs = root.querySelectorAll ? root.querySelectorAll('[role="textbox"]') : [];
                    for (var i = 0; i < tbs.length; i++) textboxes.push(tbs[i]);

                    var buttons = root.querySelectorAll ? root.querySelectorAll('[role="button"]') : [];
                    for (var j = 0; j < buttons.length; j++) {
                        var bText = (buttons[j].innerText || buttons[j].textContent || "").trim();
                        if (bText.indexOf("میکروفون") !== -1 || bText.indexOf("اجازه") !== -1 || bText.indexOf("صوتی") !== -1) {
                            micButtons.push(buttons[j]);
                        }
                    }
                }

                var roots = getAllShadowRoots();
                for (var rIdx = 0; rIdx < roots.length; rIdx++) {
                    var a11y = roots[rIdx].querySelector('#cmp_a11y_root');
                    if (a11y) checkA11yRoot(a11y);
                }

                // Synchronously unlock audio and resume any suspended audio contexts on iOS
                try {
                    unlockAudioContextAndElement();
                } catch(e) {}

                // Check hit on Mic permission buttons to trigger synchronous getUserMedia on iOS Chrome / Safari
                for (var m = 0; m < micButtons.length; m++) {
                    var mb = micButtons[m];
                    var mRect = mb.getBoundingClientRect();
                    if (x >= mRect.left && x <= mRect.right && y >= mRect.top && y <= mRect.bottom) {
                        try {
                            if (window.aiSpeakingSpeech && window.aiSpeakingSpeech.audioContext && window.aiSpeakingSpeech.audioContext.state === 'suspended') {

                for (var i = 0; i < textboxes.length; i++) {
                    var tb = textboxes[i];
                    var r = tb.getBoundingClientRect();
                    if (x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) {
                        hitTextbox = tb;
                        break;
                    }

                if (hitTextbox) {
                    var proxy = ensureProxyInput();

                    // Check if an elevated backing input is already available in any shadow root
                    var backingInput = null;
                    for (var s = 0; s < roots.length; s++) {
                        var found = roots[s].querySelector('input:not(#cmp_ios_keyboard_proxy), textarea:not(#cmp_ios_keyboard_proxy)');
                        if (found) { backingInput = found; break; }
                    }

                    if (backingInput) {
                        elevateBackingInput(backingInput);
                        try {
                            backingInput.focus();
                        } catch(e) {}
                    } else if (proxy) {
                        try { proxy.focus(); } catch(e) {}

            window.addEventListener('touchend', onNativeTouch, { capture: true, passive: true });

        // Dynamic visualViewport synchronization for iOS Safari virtual keyboard
        (function() {
            var ua = navigator.userAgent || '';
            var isIOS = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
            if (!isIOS || !window.visualViewport) return;

            function syncViewport() {
                var vv = window.visualViewport;
                if (!vv) return;
                var currentH = Math.round(vv.height);
                var winH = window.innerHeight;
                var isKeyboardVisible = (winH - currentH) > 100;

                if (isKeyboardVisible) {
                    document.documentElement.style.height = currentH + 'px';
                    document.body.style.height = currentH + 'px';
                    if (window.scrollY !== 0) {
                        window.scrollTo(0, 0);
                    }
                    if (document.body.scrollTop !== 0) {
                        document.body.scrollTop = 0;
                    }
                } else {
                    document.documentElement.style.height = '100%';
                    document.body.style.height = '100%';
                }

                // Notify Compose Multiplatform Canvas to update its layout immediately!
                window.dispatchEvent(new Event('resize'));
            }

            window.visualViewport.addEventListener('resize', syncViewport);
            window.visualViewport.addEventListener('scroll', function() {
                if (window.scrollY !== 0) {
                    window.scrollTo(0, 0);
                }
                syncViewport();
            });
        })();

        // App Loader Controller: Fades out loader when Compose canvas mounts & first frame paints
        (function() {
            var loaderHidden = false;
            window.hideAppLoader = function() {
                if (loaderHidden) return;
                loaderHidden = true;
                var loader = document.getElementById("appLoadingContainer");
                if (loader) {
                    loader.classList.add("fade-out");
                    setTimeout(function() {
                        if (loader && loader.parentNode) {
                            loader.parentNode.removeChild(loader);
                        }
                    }, 500);
                }
            };

            // Detect when Compose mounts the canvas and first paint is ready
            var obs = new MutationObserver(function() {
                var canvas = document.querySelector("canvas");
                if (canvas) {
                    // Canvas is in DOM, allow 180ms for first frame with preloaded fonts
                    setTimeout(window.hideAppLoader, 180);
                    try { obs.disconnect(); } catch(e){}
                }
            });

            if (document.body) {
                obs.observe(document.body, { childList: true, subtree: true });
            } else {
                window.addEventListener("DOMContentLoaded", function() {
                    obs.observe(document.body, { childList: true, subtree: true });
                });
            }

            // Fallback safety timeout
            setTimeout(window.hideAppLoader, 10000);
        })();
