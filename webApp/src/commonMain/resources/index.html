<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
        <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png">
        <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16x16.png">
        <link rel="manifest" href="./manifest.json">
        <title>AiSpeakingMultiplatform</title>
        <style>
            html,
            body {
                width: 100%;
                height: 100%;
                margin: 0;
                padding: 0;
                overflow: hidden;
            }
        </style>
    </head>
    <body style="text-align: center; align-content: center">
    <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 50 50" role="presentation">
        <circle cx="25" cy="25" r="20" stroke="#ccc" stroke-width="4" fill="none"/>
        <circle cx="25" cy="25" r="20" stroke="#333" stroke-width="4" fill="none" stroke-linecap="round" stroke-dasharray="90 125">
            <animateTransform attributeName="transform" type="rotate" from="0 25 25" to="360 25 25" dur="1s" repeatCount="indefinite"/>
        </circle>
    </svg>
    </body>
    <script>
        window._isAudioPlaying = false;
        window.aiSpeakingAudio = {
            audio: null,
            isPlaying: function() {
                return window._isAudioPlaying === true;
            },
            play: function(url) {
                if (this.audio) {
                    try { this.audio.pause(); } catch(e){}
                    this.audio = null;
                }
                if (!url) {
                    window._isAudioPlaying = false;
                    return;
                }
                var fullUrl = url.startsWith("http") ? url : (window.location.origin.replace(":8081", ":8080") + url);
                window._isAudioPlaying = true;
                this.audio = new Audio(fullUrl);
                var self = this;
                var finish = function() {
                    window._isAudioPlaying = false;
                    self.audio = null;
                };
                this.audio.onended = finish;
                this.audio.onerror = function(e) {
                    console.warn("Audio load error, falling back", e);
                    finish();
                };
                this.audio.play().catch(function(err) {
                    console.warn("Audio play prevented or error", err);
                    finish();
                });
            },
            stop: function() {
                window._isAudioPlaying = false;
                if (this.audio) {
                    try { this.audio.pause(); } catch(e){}
                    this.audio = null;
                }
            }
        };

        window.aiSpeakingSpeech = {
            recognition: null,
            isRecording: false,
            transcript: "",
            start: function() {
                var SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!SpeechRec) {
                    console.warn("SpeechRecognition not supported in browser");
                    return;
                }
                if (this.recognition) {
                    try { this.recognition.stop(); } catch(e){}
                }
                this.transcript = "";
                this.recognition = new SpeechRec();
                this.recognition.lang = 'en-US';
                this.recognition.continuous = true;
                this.recognition.interimResults = true;
                this.isRecording = true;
                var self = this;

                this.recognition.onresult = function(event) {
                    var text = '';
                    for (var i = 0; i < event.results.length; ++i) {
                        var chunk = (event.results[i][0].transcript || '').trim();
                        if (chunk) {
                            text += (text ? ' ' : '') + chunk;
                        }
                    }
                    if (text) {
                        self.transcript = text;
                    }
                };

                this.recognition.onerror = function(err) {
                    console.warn("STT error", err);
                };

                this.recognition.onend = function() {
                    self.isRecording = false;
                };

                try {
                    this.recognition.start();
                } catch(e) {
                    console.warn("Failed to start speech recognition", e);
                }
            },
            stop: function() {
                this.isRecording = false;
                if (this.recognition) {
                    try { this.recognition.stop(); } catch(e){}
                    this.recognition = null;
                }
            },
            getTranscript: function() {
                return this.transcript || "";
            }
        };
    </script>
    <script src="webApp.js"></script>
</html>
