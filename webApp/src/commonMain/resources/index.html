<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <base href="/app/">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
        <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png">
        <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16x16.png">
        <link rel="manifest" href="./manifest.json">
        <title>AI Speaking Plus</title>
        <style>
            html,
            body {
                width: 100%;
                height: 100%;
                margin: 0;
                padding: 0;
                overflow: hidden;
            }
        </style>
    </head>
    <body style="text-align: center; align-content: center">
    <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 50 50" role="presentation">
        <circle cx="25" cy="25" r="20" stroke="#ccc" stroke-width="4" fill="none"/>
        <circle cx="25" cy="25" r="20" stroke="#333" stroke-width="4" fill="none" stroke-linecap="round" stroke-dasharray="90 125">
            <animateTransform attributeName="transform" type="rotate" from="0 25 25" to="360 25 25" dur="1s" repeatCount="indefinite"/>
        </circle>
    </svg>
    </body>
    <script>
        window.aiSpeakingRouter = {
            _popCounter: 0,
            init: function() {
                var self = this;
                window.addEventListener('popstate', function(e) {
                    self._popCounter++;
                });
            },
            getPopCounter: function() {
                return this._popCounter;
            },
            getCurrentPath: function() {
                return window.location.pathname;
            },
            getCurrentSearch: function() {
                return window.location.search || "";
            },
            getHash: function() {
                return window.location.hash || "";
            },
            pushUrl: function(url) {
                var cur = window.location.pathname + (window.location.search || "");
                if (cur !== url) {
                    window.history.pushState({ path: url }, "", url);
                }
            },
            replaceUrl: function(url) {
                var cur = window.location.pathname + (window.location.search || "");
                if (cur !== url) {
                    window.history.replaceState({ path: url }, "", url);
                }
            }
        };
        window.aiSpeakingRouter.init();

        window.aiSpeakingVideo = {
            overlay: null,
            video: null,
            _hasEnded: false,
            _hasSkipped: false,
            _isPlaying: false,

            show: function(src) {
                this._hasEnded = false;
                this._hasSkipped = false;
                this._isPlaying = false;

                if (!this.overlay) {
                    this._createDom();
                }

                var fullUrl = (src && (src.startsWith("http://") || src.startsWith("https://")))
                    ? src
                    : (window.location.origin + (src.startsWith("/") ? src : "/" + src));

                this.video.src = fullUrl;
                this.overlay.style.display = "flex";
                this.overlay.style.opacity = "1";
                this._updateMuteButton(false);

                var self = this;
                var playPromise = this.video.play();
                if (playPromise !== undefined) {
                    playPromise.then(function() {
                        self._isPlaying = true;
                    }).catch(function(err) {
                        console.warn("Autoplay with sound prevented, muting to start playback:", err);
                        self.video.muted = true;
                        self._updateMuteButton(true);
                        self.video.play().then(function() {
                            self._isPlaying = true;
                            self._showUnmuteHint();
                        }).catch(function(e) {
                            console.error("Video play failed:", e);
                        });
                    });
                }
            },

            hide: function() {
                if (this.video) {
                    try { this.video.pause(); } catch(e){}
                }
                if (this.overlay) {
                    this.overlay.style.display = "none";
                }
                this._isPlaying = false;
            },

            consumeEnded: function() {
                if (this._hasEnded) {
                    this._hasEnded = false;
                    return true;
                }
                return false;
            },

            consumeSkipped: function() {
                if (this._hasSkipped) {
                    this._hasSkipped = false;
                    return true;
                }
                return false;
            },

            _createDom: function() {
                var self = this;
                var overlay = document.createElement("div");
                overlay.id = "aiSpeakingVideoOverlay";
                overlay.style.position = "fixed";
                overlay.style.top = "0";
                overlay.style.left = "0";
                overlay.style.width = "100%";
                overlay.style.height = "100%";
                overlay.style.backgroundColor = "rgba(0,0,0,0.92)";
                overlay.style.zIndex = "99999";
                overlay.style.display = "none";
                overlay.style.flexDirection = "column";
                overlay.style.alignItems = "center";
                overlay.style.justifyContent = "center";
                overlay.style.transition = "opacity 0.3s ease";
                overlay.style.overflow = "hidden";

                var playerBox = document.createElement("div");
                playerBox.style.position = "relative";
                playerBox.style.width = "100%";
                playerBox.style.maxWidth = "430px";
                playerBox.style.height = "100%";
                playerBox.style.maxHeight = "900px";
                playerBox.style.display = "flex";
                playerBox.style.flexDirection = "column";
                playerBox.style.justifyContent = "center";
                playerBox.style.alignItems = "center";
                playerBox.style.backgroundColor = "#000";
                playerBox.style.borderRadius = (window.innerWidth > 560) ? "16px" : "0";
                playerBox.style.boxShadow = "0 25px 50px -12px rgba(0, 0, 0, 0.7)";
                playerBox.style.overflow = "hidden";

                var video = document.createElement("video");
                video.setAttribute("playsinline", "");
                video.setAttribute("webkit-playsinline", "");
                video.setAttribute("preload", "auto");
                video.style.width = "100%";
                video.style.height = "100%";
                video.style.objectFit = "cover";
                video.style.backgroundColor = "#000";

                // Top Controls Bar
                var topBar = document.createElement("div");
                topBar.style.position = "absolute";
                topBar.style.top = "16px";
                topBar.style.left = "16px";
                topBar.style.right = "16px";
                topBar.style.display = "flex";
                topBar.style.justifyContent = "space-between";
                topBar.style.alignItems = "center";
                topBar.style.zIndex = "10";
                topBar.style.direction = "rtl";

                // Skip Button
                var skipBtn = document.createElement("button");
                skipBtn.innerHTML = "رد کردن ›";
                skipBtn.style.padding = "8px 18px";
                skipBtn.style.backgroundColor = "rgba(255, 255, 255, 0.2)";
                skipBtn.style.backdropFilter = "blur(12px)";
                skipBtn.style.webkitBackdropFilter = "blur(12px)";
                skipBtn.style.border = "1px solid rgba(255, 255, 255, 0.35)";
                skipBtn.style.borderRadius = "20px";
                skipBtn.style.color = "#ffffff";
                skipBtn.style.fontSize = "13px";
                skipBtn.style.fontWeight = "600";
                skipBtn.style.fontFamily = "Vazirmatn, system-ui, sans-serif";
                skipBtn.style.cursor = "pointer";
                skipBtn.style.boxShadow = "0 4px 12px rgba(0,0,0,0.3)";
                skipBtn.onclick = function(e) {
                    e.stopPropagation();
                    self._hasSkipped = true;
                    self.hide();
                };

                // Sound Toggle Button
                var soundBtn = document.createElement("button");
                soundBtn.id = "videoMuteBtn";
                soundBtn.innerHTML = "🔊";
                soundBtn.style.width = "38px";
                soundBtn.style.height = "38px";
                soundBtn.style.backgroundColor = "rgba(255, 255, 255, 0.2)";
                soundBtn.style.backdropFilter = "blur(12px)";
                soundBtn.style.webkitBackdropFilter = "blur(12px)";
                soundBtn.style.border = "1px solid rgba(255, 255, 255, 0.35)";
                soundBtn.style.borderRadius = "50%";
                soundBtn.style.color = "#ffffff";
                soundBtn.style.fontSize = "16px";
                soundBtn.style.cursor = "pointer";
                soundBtn.style.display = "flex";
                soundBtn.style.alignItems = "center";
                soundBtn.style.justifyContent = "center";
                soundBtn.onclick = function(e) {
                    e.stopPropagation();
                    self.video.muted = !self.video.muted;
                    self._updateMuteButton(self.video.muted);
                    self._hideUnmuteHint();
                };

                topBar.appendChild(skipBtn);
                topBar.appendChild(soundBtn);

                // Unmute hint
                var unmuteHint = document.createElement("div");
                unmuteHint.id = "videoUnmuteHint";
                unmuteHint.innerHTML = "🔊 برای شنیدن صدا لمس کنید";
                unmuteHint.style.position = "absolute";
                unmuteHint.style.bottom = "24px";
                unmuteHint.style.backgroundColor = "rgba(30, 41, 59, 0.85)";
                unmuteHint.style.backdropFilter = "blur(8px)";
                unmuteHint.style.border = "1px solid rgba(59, 130, 246, 0.5)";
                unmuteHint.style.color = "#60A5FA";
                unmuteHint.style.padding = "8px 16px";
                unmuteHint.style.borderRadius = "20px";
                unmuteHint.style.fontSize = "13px";
                unmuteHint.style.fontWeight = "bold";
                unmuteHint.style.fontFamily = "Vazirmatn, sans-serif";
                unmuteHint.style.cursor = "pointer";
                unmuteHint.style.display = "none";
                unmuteHint.style.zIndex = "10";
                unmuteHint.onclick = function(e) {
                    e.stopPropagation();
                    self.video.muted = false;
                    self._updateMuteButton(false);
                    self._hideUnmuteHint();
                };

                video.onclick = function() {
                    if (video.muted) {
                        video.muted = false;
                        self._updateMuteButton(false);
                        self._hideUnmuteHint();
                    } else if (video.paused) {
                        video.play();
                    } else {
                        video.pause();
                    }
                };

                video.onended = function() {
                    self._hasEnded = true;
                    self.hide();
                };

                playerBox.appendChild(video);
                playerBox.appendChild(topBar);
                playerBox.appendChild(unmuteHint);
                overlay.appendChild(playerBox);
                document.body.appendChild(overlay);

                this.overlay = overlay;
                this.video = video;
                this.muteBtn = soundBtn;
                this.unmuteHint = unmuteHint;
            },

            _updateMuteButton: function(muted) {
                if (this.muteBtn) {
                    this.muteBtn.innerHTML = muted ? "🔇" : "🔊";
                }
            },

            _showUnmuteHint: function() {
                if (this.unmuteHint) {
                    this.unmuteHint.style.display = "block";
                }
            },

            _hideUnmuteHint: function() {
                if (this.unmuteHint) {
                    this.unmuteHint.style.display = "none";
                }
            }
        };

        window._isAudioPlaying = false;
        window.aiSpeakingAudio = {
            audio: null,
            isPlaying: function() {
                return window._isAudioPlaying === true;
            },
            play: function(url) {
                if (this.audio) {
                    try { this.audio.pause(); } catch(e){}
                    this.audio = null;
                }
                if (!url) {
                    window._isAudioPlaying = false;
                    return;
                }
                var fullUrl = (url.startsWith("http://") || url.startsWith("https://")) ? url : (window.location.origin + (url.startsWith("/") ? url : "/" + url));
                window._isAudioPlaying = true;
                this.audio = new Audio(fullUrl);
                var self = this;
                var finish = function() {
                    window._isAudioPlaying = false;
                    self.audio = null;
                };
                this.audio.onended = finish;
                this.audio.onerror = function(e) {
                    console.warn("Audio load error, falling back", e);
                    finish();
                };
                this.audio.play().catch(function(err) {
                    console.warn("Audio play prevented or error", err);
                    finish();
                });
            },
            stop: function() {
                window._isAudioPlaying = false;
                if (this.audio) {
                    try { this.audio.pause(); } catch(e){}
                    this.audio = null;
                }
            }
        };

        window.aiSpeakingSpeech = {
            recognition: null,
            mediaStream: null,
            audioContext: null,
            audioInputSource: null,
            audioProcessor: null,
            _pcmChunkQueue: [],
            _hasVoiceActivity: false,
            _lastVoiceActivityTime: 0,
            isRecording: false,
            _userWantsRecording: false,
            _micPermissionGranted: false,
            _restartTimeout: null,
            _accumulatedTranscript: "",
            _currentSessionTranscript: "",
            transcript: "",
            _consecutiveErrors: 0,
            _isMobile: false,
            _isIOS: false,

            _initDevice: function() {
                var ua = navigator.userAgent || '';
                this._isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(ua) ||
                                 (navigator.userAgentData && navigator.userAgentData.mobile) ||
                                 (navigator.maxTouchPoints && navigator.maxTouchPoints > 1);
                this._isIOS = /iPhone|iPad|iPod/i.test(ua) ||
                              (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
            },

            _checkSecureContext: function() {
                var isLocal = window.location.hostname === 'localhost' ||
                              window.location.hostname === '127.0.0.1' ||
                              window.location.hostname === '0.0.0.0' ||
                              window.location.hostname === '[::1]' ||
                              window.location.hostname.endsWith('.localhost');
                var isSecure = window.isSecureContext || window.location.protocol === 'https:' || isLocal;
                if (!isSecure) {
                    console.warn("[aiSpeakingSpeech] Insecure origin detected (" + window.location.origin + "). " +
                        "Microphone and Web Speech API will be blocked by browsers on non-localhost HTTP. " +
                        "Use HTTPS (or localhost) to enable audio recording.");
                }
                return isSecure;
            },

            _downsampleBuffer: function(buffer, sourceRate, targetRate) {
                if (sourceRate === targetRate) return buffer;
                var ratio = sourceRate / targetRate;
                var newLength = Math.round(buffer.length / ratio);
                var result = new Float32Array(newLength);
                var offsetResult = 0;
                var offsetBuffer = 0;
                while (offsetResult < result.length) {
                    var nextOffsetBuffer = Math.round((offsetResult + 1) * ratio);
                    var accum = 0, count = 0;
                    for (var i = offsetBuffer; i < nextOffsetBuffer && i < buffer.length; i++) {
                        accum += buffer[i];
                        count++;
                    }
                    result[offsetResult] = count > 0 ? (accum / count) : 0;
                    offsetResult++;
                    offsetBuffer = nextOffsetBuffer;
                }
                return result;
            },

            _floatToPcm16: function(samples) {
                var output = new Uint8Array(samples.length * 2);
                for (var i = 0; i < samples.length; i++) {
                    var s = Math.max(-1, Math.min(1, samples[i]));
                    var val = s < 0 ? s * 0x8000 : s * 0x7FFF;
                    var intVal = Math.floor(val);
                    output[i * 2] = intVal & 0xFF;
                    output[i * 2 + 1] = (intVal >> 8) & 0xFF;
                }
                return output;
            },

            _uint8ToBase64: function(u8) {
                var binary = '';
                var len = u8.byteLength;
                for (var i = 0; i < len; i++) {
                    binary += String.fromCharCode(u8[i]);
                }
                return window.btoa(binary);
            },

            start: function() {
                this._initDevice();
                this._checkSecureContext();

                if (this._restartTimeout) {
                    clearTimeout(this._restartTimeout);
                    this._restartTimeout = null;
                }

                this._userWantsRecording = true;
                this.isRecording = true;
                this.transcript = "";
                this._accumulatedTranscript = "";
                this._currentSessionTranscript = "";
                this._pcmChunkQueue = [];
                this._hasVoiceActivity = false;
                this._consecutiveErrors = 0;

                var self = this;
                if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                    console.warn("[aiSpeakingSpeech] navigator.mediaDevices.getUserMedia not available, trying speech recognition fallback");
                    this._startRecognitionInstance();
                    return;
                }

                navigator.mediaDevices.getUserMedia({
                    audio: {
                        channelCount: 1,
                        echoCancellation: true,
                        noiseSuppression: true,
                        autoGainControl: true
                    }
                }).then(function(stream) {
                    if (!self._userWantsRecording) {
                        try { stream.getTracks().forEach(function(t) { t.stop(); }); } catch(e) {}
                        return;
                    }

                    self.mediaStream = stream;
                    var AudioContextClass = window.AudioContext || window.webkitAudioContext;
                    if (!AudioContextClass) {
                        console.warn("[aiSpeakingSpeech] AudioContext not available, falling back to SpeechRecognition");
                        self._startRecognitionInstance();
                        return;
                    }

                    try {
                        try {
                            self.audioContext = new AudioContextClass({ sampleRate: 16000 });
                        } catch(e) {
                            self.audioContext = new AudioContextClass();
                        }
                    } catch(err) {
                        console.warn("[aiSpeakingSpeech] Failed to create AudioContext:", err);
                        self._startRecognitionInstance();
                        return;
                    }

                    try {
                        if (self.audioContext.state === 'suspended') {
                            self.audioContext.resume();
                        }

                        self.audioInputSource = self.audioContext.createMediaStreamSource(stream);
                        self.audioProcessor = self.audioContext.createScriptProcessor(2048, 1, 1);

                        self.audioProcessor.onaudioprocess = function(e) {
                            if (!self.isRecording) return;
                            var rawInput = e.inputBuffer.getChannelData(0);
                            var ctxRate = self.audioContext.sampleRate || 16000;
                            var downsampled = self._downsampleBuffer(rawInput, ctxRate, 16000);
                            if (!downsampled || downsampled.length === 0) return;

                            var sumSquares = 0;
                            for (var k = 0; k < downsampled.length; k++) {
                                sumSquares += downsampled[k] * downsampled[k];
                            }
                            var rms = Math.sqrt(sumSquares / downsampled.length);
                            if (rms > 0.012) {
                                self._hasVoiceActivity = true;
                                self._lastVoiceActivityTime = Date.now();
                            }

                            var pcm16Bytes = self._floatToPcm16(downsampled);
                            var b64Chunk = self._uint8ToBase64(pcm16Bytes);

                            if (typeof window.onAiSpeakingAudioChunk === 'function') {
                                try { window.onAiSpeakingAudioChunk(b64Chunk); } catch(err) {}
                            }

                            if (self._pcmChunkQueue.length > 80) {
                                self._pcmChunkQueue.shift();
                            }
                            self._pcmChunkQueue.push(b64Chunk);
                        };

                        var zeroGain = self.audioContext.createGain();
                        zeroGain.gain.value = 0;
                        self.zeroGain = zeroGain;

                        self.audioInputSource.connect(self.audioProcessor);
                        self.audioProcessor.connect(zeroGain);
                        zeroGain.connect(self.audioContext.destination);
                        self.isRecording = true;
                    } catch(err) {
                        console.error("[aiSpeakingSpeech] Web Audio processing graph error:", err);
                        self._startRecognitionInstance();
                    }
                }).catch(function(err) {
                    console.error("[aiSpeakingSpeech] getUserMedia error:", err);
                    self.isRecording = false;
                    self._userWantsRecording = false;
                    if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {
                        var msg = "دسترسی به میکروفون رد شد. لطفاً دسترسی به میکروفون را در تنظیمات مرورگر فعال کنید.";
                        if (!self._checkSecureContext()) {
                            msg += "\n\n(نکته: در مرورگرهای موبایل و شبکه محلی، دسترسی به میکروفون نیازمند HTTPS است.)";
                        }
                        alert(msg);
                    } else {
                        self._startRecognitionInstance();
                    }
                });
            },

            drainPcmChunks: function() {
                if (!this._pcmChunkQueue || this._pcmChunkQueue.length === 0) {
                    return "";
                }
                var drained = this._pcmChunkQueue.splice(0, this._pcmChunkQueue.length);
                return drained.join("|");
            },

            hasVoiceActivity: function() {
                var active = this._hasVoiceActivity;
                this._hasVoiceActivity = false;
                return active;
            },

            _startRecognitionInstance: function() {
                if (!this._userWantsRecording) {
                    return;
                }

                var SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!SpeechRec) return;

                if (this.recognition) {
                    try {
                        this.recognition.onend = null;
                        this.recognition.onerror = null;
                        this.recognition.onresult = null;
                        this.recognition.abort();
                    } catch(e) {}
                    this.recognition = null;
                }

                var self = this;
                var recognition = new SpeechRec();
                this.recognition = recognition;

                recognition.lang = 'en-US';
                recognition.continuous = !this._isIOS;
                recognition.interimResults = true;
                recognition.maxAlternatives = 1;

                recognition.onresult = function(event) {
                    self._consecutiveErrors = 0;
                    var sessionText = '';
                    for (var i = 0; i < event.results.length; ++i) {
                        var chunk = (event.results[i][0].transcript || '').trim();
                        if (chunk) {
                            sessionText += (sessionText ? ' ' : '') + chunk;
                        }
                    }
                    self._currentSessionTranscript = sessionText;
                    var full = self._accumulatedTranscript;
                    if (sessionText) {
                        full = (full ? full + ' ' : '') + sessionText;
                    }
                    self.transcript = full.trim();
                };

                recognition.onerror = function(event) {
                    var err = event.error || (event.message || 'unknown');
                    console.warn("[aiSpeakingSpeech] STT error:", err);

                    if (err === 'no-speech' || err === 'audio-capture' || err === 'aborted') {
                        return;
                    }

                    if (err === 'not-allowed' || err === 'service-not-allowed') {
                        self._userWantsRecording = false;
                        self.isRecording = false;
                        return;
                    }

                    self._consecutiveErrors++;
                    if (self._consecutiveErrors > 5) {
                        self.stop();
                    }
                };

                recognition.onend = function() {
                    if (self._currentSessionTranscript) {
                        self._accumulatedTranscript = (self._accumulatedTranscript ? self._accumulatedTranscript + ' ' : '') + self._currentSessionTranscript;
                        self._currentSessionTranscript = "";
                        self.transcript = self._accumulatedTranscript.trim();
                    }

                    if (self._userWantsRecording) {
                        self._restartTimeout = setTimeout(function() {
                            if (self._userWantsRecording) {
                                self._startRecognitionInstance();
                            }
                        }, 150);
                    } else {
                        self.isRecording = false;
                    }
                };

                try {
                    recognition.start();
                    this.isRecording = true;
                } catch(err) {
                    console.warn("[aiSpeakingSpeech] recognition.start() error:", err);
                    if (recognition.continuous) {
                        try {
                            recognition.continuous = false;
                            recognition.start();
                            this.isRecording = true;
                            return;
                        } catch(e) {}
                    }

                    if (this._userWantsRecording) {
                        this._restartTimeout = setTimeout(function() {
                            if (self._userWantsRecording) {
                                self._startRecognitionInstance();
                            }
                        }, 500);
                    } else {
                        this.isRecording = false;
                    }
                }
            },

            stop: function() {
                this._userWantsRecording = false;
                this.isRecording = false;

                if (this._restartTimeout) {
                    clearTimeout(this._restartTimeout);
                    this._restartTimeout = null;
                }

                if (this.audioProcessor) {
                    try {
                        this.audioProcessor.disconnect();
                        this.audioProcessor.onaudioprocess = null;
                    } catch(e) {}
                    this.audioProcessor = null;
                }

                if (this.zeroGain) {
                    try { this.zeroGain.disconnect(); } catch(e) {}
                    this.zeroGain = null;
                }

                if (this.audioInputSource) {
                    try { this.audioInputSource.disconnect(); } catch(e) {}
                    this.audioInputSource = null;
                }

                if (this.audioContext) {
                    try { this.audioContext.close(); } catch(e) {}
                    this.audioContext = null;
                }

                if (this.mediaStream) {
                    try {
                        this.mediaStream.getTracks().forEach(function(track) { track.stop(); });
                    } catch(e) {}
                    this.mediaStream = null;
                }

                if (this.recognition) {
                    try {
                        this.recognition.onend = null;
                        this.recognition.onerror = null;
                        this.recognition.stop();
                    } catch(e) {}
                    this.recognition = null;
                }

                if (this._currentSessionTranscript) {
                    this._accumulatedTranscript = (this._accumulatedTranscript ? this._accumulatedTranscript + ' ' : '') + this._currentSessionTranscript;
                    this._currentSessionTranscript = "";
                    this.transcript = this._accumulatedTranscript.trim();
                }
            },

            getTranscript: function() {
                return this.transcript || "";
            }
        };
    </script>

    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-messaging-compat.js"></script>

    <script>
        window.aiSpeakingPush = {
            fcmToken: null,
            messaging: null,
            serviceWorkerRegistration: null,

            init: function() {
                if (!('serviceWorker' in navigator) || !('Notification' in window)) {
                    console.warn('[FCM Web] Service Worker or Notifications not supported in this browser.');
                    return;
                }

                try {
                    if (!firebase.apps.length) {
                        firebase.initializeApp({
                            apiKey: "AIzaSyBixaaHlw2PcUHuFqFTni5R09fs4jECEn4",
                            projectId: "aispeaking-132a3",
                            messagingSenderId: "160657659274",
                            storageBucket: "aispeaking-132a3.firebasestorage.app",
                            appId: "1:160657659274:web:332012813a23198cfc6473",
                            authDomain: "aispeaking-132a3.firebaseapp.com"
                        });
                    }
                    this.messaging = firebase.messaging();
                } catch (e) {
                    console.error('[FCM Web] Firebase initialization error:', e);
                    return;
                }

                var self = this;

                // Register Service Worker from root
                navigator.serviceWorker.register('./firebase-messaging-sw.js')
                    .then(function(registration) {
                        self.serviceWorkerRegistration = registration;
                        console.log('[FCM Web] Service Worker registered with scope:', registration.scope);

                        // If already granted, retrieve token directly
                        if (Notification.permission === 'granted') {
                            self.requestToken();
                        }
                    })
                    .catch(function(err) {
                        console.warn('[FCM Web] Service Worker registration failed:', err);
                    });

                // Foreground message listener
                this.messaging.onMessage(function(payload) {
                    console.log('[FCM Web] Foreground notification received:', payload);
                    self._handleForegroundMessage(payload);
                });

                // Listen for messages from service worker (e.g. notification click deep link)
                navigator.serviceWorker.addEventListener('message', function(event) {
                    if (event.data && event.data.type === 'FCM_DEEP_LINK') {
                        console.log('[FCM Web] Navigation message from service worker:', event.data);
                        self.navigateToUrl(event.data.url);
                    }
                });
            },

            requestPermissionAndToken: function() {
                var self = this;
                if (!('Notification' in window)) {
                    return Promise.reject(new Error("Notifications not supported"));
                }
                return Notification.requestPermission().then(function(permission) {
                    console.log('[FCM Web] Notification permission status:', permission);
                    if (permission === 'granted') {
                        return self.requestToken();
                    } else {
                        return null;
                    }
                });
            },

            requestToken: function() {
                var self = this;
                if (!this.messaging || !this.serviceWorkerRegistration) {
                    return Promise.resolve(null);
                }

                var tokenOptions = {
                    serviceWorkerRegistration: this.serviceWorkerRegistration
                };
                if (window.FIREBASE_VAPID_KEY) {
                    tokenOptions.vapidKey = window.FIREBASE_VAPID_KEY;
                }

                return this.messaging.getToken(tokenOptions)
                    .then(function(token) {
                        if (token) {
                            self.fcmToken = token;
                            try { localStorage.setItem('fcm_web_token', token); } catch(e){}
                            console.log('%c[FCM Web Token]: ' + token, 'color: #10B981; font-weight: bold;');
                            if (typeof window.onFcmWebTokenReceived === 'function') {
                                try { window.onFcmWebTokenReceived(token); } catch(e){}
                            }
                            try {
                                fetch('/api/v1/notifications/register-token', {
                                    method: 'POST',
                                    headers: { 'Content-Type': 'application/json' },
                                    body: JSON.stringify({ token: token, topic: 'aispeaking_plus_v1' })
                                }).catch(function() {});
                            } catch(e) {}
                            return token;
                        } else {
                            console.warn('[FCM Web] No registration token returned.');
                            return null;
                        }
                    })
                    .catch(function(err) {
                        console.warn('[FCM Web] Error getting FCM web token:', err);
                        return null;
                    });
            },

            navigateToUrl: function(url) {
                if (!url) return;
                try {
                    var parsed = new URL(url, window.location.origin);
                    if (parsed.hash) {
                        window.location.hash = parsed.hash;
                    }
                } catch(e) {
                    if (url.indexOf('#') !== -1) {
                        window.location.hash = url.substring(url.indexOf('#'));
                    }
                }
            },

            _handleForegroundMessage: function(payload) {
                var title = payload.notification?.title || payload.data?.title || 'AI Speaking Plus';
                var body = payload.notification?.body || payload.data?.body || payload.data?.message || '';
                var data = payload.data || {};

                if (Notification.permission === 'granted') {
                    try {
                        var n = new Notification(title, {
                            body: body,
                            icon: payload.notification?.icon || data.icon || './android-chrome-192x192.png',
                            data: data
                        });
                        var self = this;
                        n.onclick = function() {
                            n.close();
                            window.focus();
                            var screen = (data.screen || '').toLowerCase().trim();
                            if (!screen || screen === 'none') {
                                if (!data.url && !data.stage_id && !data.stageId) {
                                    return;
                                }
                            }
                            if (data.url) {
                                self.navigateToUrl(data.url);
                            } else if (data.stage_id || data.stageId) {
                                var stageId = data.stage_id || data.stageId;
                                window.location.hash = 'chat?stageId=' + encodeURIComponent(stageId);
                            } else if (screen) {
                                if (screen === 'profile') window.location.hash = 'profile';
                                else if (screen === 'subscription' || screen === 'sub') window.location.hash = 'subscription';
                                else if (screen === 'stages' || screen === 'stages_list') window.location.hash = 'stages';
                                else if (screen === 'login') window.location.hash = 'login';
                                else window.location.hash = 'main';
                            }
                        };
                    } catch(e) {
                        console.warn('[FCM Web] Foreground notification presentation failed:', e);
                    }
                }
            }
        };

        // Initialize when window finishes loading
        window.addEventListener('load', function() {
            window.aiSpeakingPush.init();
        });

        // Request permission on first user gesture (click/tap) if still in 'default' state
        var requestNotificationOnGesture = function() {
            if (window.Notification && Notification.permission === 'default') {
                window.aiSpeakingPush.requestPermissionAndToken();
            }
            window.removeEventListener('click', requestNotificationOnGesture);
            window.removeEventListener('touchend', requestNotificationOnGesture);
        };
        window.addEventListener('click', requestNotificationOnGesture, { once: true });
        window.addEventListener('touchend', requestNotificationOnGesture, { once: true });
        // Compose Web Keyboard Accessibility & Tab Navigation Support (BUG-06)
        (function() {
            var INTERACTIVE_ROLES = new Set([
                'button',
                'textbox',
                'checkbox',
                'switch',
                'link',
                'combobox',
                'menuitem',
                'tab'
            ]);

            function updateInteractiveNode(el) {
                var role = el.getAttribute('role');
                var isHidden = el.getAttribute('aria-hidden') === 'true';
                var isDisabled = el.getAttribute('aria-disabled') === 'true';

                if (role && INTERACTIVE_ROLES.has(role) && !isHidden) {
                    if (isDisabled) {
                        el.setAttribute('tabindex', '-1');
                    } else if (el.getAttribute('tabindex') !== '0') {
                        el.setAttribute('tabindex', '0');
                    }

                    if (!el._hasA11yKeyHandler) {
                        el._hasA11yKeyHandler = true;
                        el.addEventListener('keydown', function(evt) {
                            if (evt.key === 'Enter' || evt.key === ' ') {
                                if (el.getAttribute('role') === 'button' || el.getAttribute('role') === 'checkbox') {
                                    evt.preventDefault();
                                    el.click();
                                }
                            }
                        });
                    }
                } else if (el.getAttribute('tabindex') === '0' && (!role || !INTERACTIVE_ROLES.has(role))) {
                    el.removeAttribute('tabindex');
                }
            }

            function processA11yTree(root) {
                if (!root) return;
                var candidates = root.querySelectorAll ? root.querySelectorAll('[role]') : [];
                for (var i = 0; i < candidates.length; i++) {
                    updateInteractiveNode(candidates[i]);
                }
            }

            function attachObserverToA11yRoot(a11yRoot) {
                if (!a11yRoot || a11yRoot._a11yObserverAttached) return;
                a11yRoot._a11yObserverAttached = true;
                processA11yTree(a11yRoot);

                var observer = new MutationObserver(function(mutations) {
                    for (var i = 0; i < mutations.length; i++) {
                        var mutation = mutations[i];
                        if (mutation.type === 'childList') {
                            for (var j = 0; j < mutation.addedNodes.length; j++) {
                                var node = mutation.addedNodes[j];
                                if (node.nodeType === 1) {
                                    if (node.hasAttribute('role')) updateInteractiveNode(node);
                                    processA11yTree(node);
                                }
                            }
                        } else if (mutation.type === 'attributes') {
                            if (mutation.target && mutation.target.nodeType === 1) {
                                updateInteractiveNode(mutation.target);
                            }
                        }
                    }
                });

                observer.observe(a11yRoot, {
                    childList: true,
                    subtree: true,
                    attributes: true,
                    attributeFilter: ['role', 'aria-hidden', 'aria-disabled']
                });
            }

            function scanForA11yRoots() {
                var root = document.getElementById('cmp_a11y_root');
                if (root) attachObserverToA11yRoot(root);

                var allEls = document.querySelectorAll('*');
                for (var i = 0; i < allEls.length; i++) {
                    var shadow = allEls[i].shadowRoot;
                    if (shadow) {
                        var shadowRoot = shadow.querySelector('#cmp_a11y_root');
                        if (shadowRoot) attachObserverToA11yRoot(shadowRoot);
                    }
                }
            }

            // Intercept attachShadow to attach immediately to canvas host
            var origAttachShadow = Element.prototype.attachShadow;
            Element.prototype.attachShadow = function(init) {
                var shadow = origAttachShadow.apply(this, arguments);
                var shadowObserver = new MutationObserver(function() {
                    var a11y = shadow.querySelector('#cmp_a11y_root');
                    if (a11y) attachObserverToA11yRoot(a11y);
                });
                shadowObserver.observe(shadow, { childList: true, subtree: true });
                return shadow;
            };

            var bodyObserver = new MutationObserver(scanForA11yRoots);
            if (document.body) {
                bodyObserver.observe(document.body, { childList: true, subtree: true });
                scanForA11yRoots();
            } else {
                window.addEventListener('DOMContentLoaded', function() {
                    bodyObserver.observe(document.body, { childList: true, subtree: true });
                    scanForA11yRoots();
                });
            }

            var scanCount = 0;
            var scanInterval = setInterval(function() {
                scanForA11yRoots();
                scanCount++;
                if (scanCount > 20) clearInterval(scanInterval);
            }, 500);
        })();
    </script>
