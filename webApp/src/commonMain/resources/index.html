<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
        <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png">
        <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16x16.png">
        <link rel="manifest" href="./manifest.json">
        <title>AI Speaking Plus</title>
        <style>
            html,
            body {
                width: 100%;
                height: 100%;
                margin: 0;
                padding: 0;
                overflow: hidden;
            }
        </style>
    </head>
    <body style="text-align: center; align-content: center">
    <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 50 50" role="presentation">
        <circle cx="25" cy="25" r="20" stroke="#ccc" stroke-width="4" fill="none"/>
        <circle cx="25" cy="25" r="20" stroke="#333" stroke-width="4" fill="none" stroke-linecap="round" stroke-dasharray="90 125">
            <animateTransform attributeName="transform" type="rotate" from="0 25 25" to="360 25 25" dur="1s" repeatCount="indefinite"/>
        </circle>
    </svg>
    </body>
    <script>
        window._isAudioPlaying = false;
        window.aiSpeakingAudio = {
            audio: null,
            isPlaying: function() {
                return window._isAudioPlaying === true;
            },
            play: function(url) {
                if (this.audio) {
                    try { this.audio.pause(); } catch(e){}
                    this.audio = null;
                }
                if (!url) {
                    window._isAudioPlaying = false;
                    return;
                }
                var fullUrl = (url.startsWith("http://") || url.startsWith("https://")) ? url : (window.location.origin + (url.startsWith("/") ? url : "/" + url));
                window._isAudioPlaying = true;
                this.audio = new Audio(fullUrl);
                var self = this;
                var finish = function() {
                    window._isAudioPlaying = false;
                    self.audio = null;
                };
                this.audio.onended = finish;
                this.audio.onerror = function(e) {
                    console.warn("Audio load error, falling back", e);
                    finish();
                };
                this.audio.play().catch(function(err) {
                    console.warn("Audio play prevented or error", err);
                    finish();
                });
            },
            stop: function() {
                window._isAudioPlaying = false;
                if (this.audio) {
                    try { this.audio.pause(); } catch(e){}
                    this.audio = null;
                }
            }
        };

        window.aiSpeakingSpeech = {
            recognition: null,
            mediaStream: null,
            audioContext: null,
            audioInputSource: null,
            audioProcessor: null,
            _pcmChunkQueue: [],
            _hasVoiceActivity: false,
            _lastVoiceActivityTime: 0,
            isRecording: false,
            _userWantsRecording: false,
            _micPermissionGranted: false,
            _restartTimeout: null,
            _accumulatedTranscript: "",
            _currentSessionTranscript: "",
            transcript: "",
            _consecutiveErrors: 0,
            _isMobile: false,
            _isIOS: false,

            _initDevice: function() {
                var ua = navigator.userAgent || '';
                this._isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(ua) ||
                                 (navigator.userAgentData && navigator.userAgentData.mobile) ||
                                 (navigator.maxTouchPoints && navigator.maxTouchPoints > 1);
                this._isIOS = /iPhone|iPad|iPod/i.test(ua) ||
                              (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
            },

            _checkSecureContext: function() {
                var isLocal = window.location.hostname === 'localhost' ||
                              window.location.hostname === '127.0.0.1' ||
                              window.location.hostname === '0.0.0.0' ||
                              window.location.hostname === '[::1]' ||
                              window.location.hostname.endsWith('.localhost');
                var isSecure = window.isSecureContext || window.location.protocol === 'https:' || isLocal;
                if (!isSecure) {
                    console.warn("[aiSpeakingSpeech] Insecure origin detected (" + window.location.origin + "). " +
                        "Microphone and Web Speech API will be blocked by browsers on non-localhost HTTP. " +
                        "Use HTTPS (or localhost) to enable audio recording.");
                }
                return isSecure;
            },

            _downsampleBuffer: function(buffer, sourceRate, targetRate) {
                if (sourceRate === targetRate) return buffer;
                var ratio = sourceRate / targetRate;
                var newLength = Math.round(buffer.length / ratio);
                var result = new Float32Array(newLength);
                var offsetResult = 0;
                var offsetBuffer = 0;
                while (offsetResult < result.length) {
                    var nextOffsetBuffer = Math.round((offsetResult + 1) * ratio);
                    var accum = 0, count = 0;
                    for (var i = offsetBuffer; i < nextOffsetBuffer && i < buffer.length; i++) {
                        accum += buffer[i];
                        count++;
                    }
                    result[offsetResult] = count > 0 ? (accum / count) : 0;
                    offsetResult++;
                    offsetBuffer = nextOffsetBuffer;
                }
                return result;
            },

            _floatToPcm16: function(samples) {
                var output = new Uint8Array(samples.length * 2);
                for (var i = 0; i < samples.length; i++) {
                    var s = Math.max(-1, Math.min(1, samples[i]));
                    var val = s < 0 ? s * 0x8000 : s * 0x7FFF;
                    var intVal = Math.floor(val);
                    output[i * 2] = intVal & 0xFF;
                    output[i * 2 + 1] = (intVal >> 8) & 0xFF;
                }
                return output;
            },

            _uint8ToBase64: function(u8) {
                var binary = '';
                var len = u8.byteLength;
                for (var i = 0; i < len; i++) {
                    binary += String.fromCharCode(u8[i]);
                }
                return window.btoa(binary);
            },

            start: function() {
                this._initDevice();
                this._checkSecureContext();

                if (this._restartTimeout) {
                    clearTimeout(this._restartTimeout);
                    this._restartTimeout = null;
                }

                this._userWantsRecording = true;
                this.isRecording = true;
                this.transcript = "";
                this._accumulatedTranscript = "";
                this._currentSessionTranscript = "";
                this._pcmChunkQueue = [];
                this._hasVoiceActivity = false;
                this._consecutiveErrors = 0;

                var self = this;
                if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                    console.warn("[aiSpeakingSpeech] navigator.mediaDevices.getUserMedia not available, trying speech recognition fallback");
                    this._startRecognitionInstance();
                    return;
                }

                navigator.mediaDevices.getUserMedia({
                    audio: {
                        channelCount: 1,
                        echoCancellation: true,
                        noiseSuppression: true,
                        autoGainControl: true
                    }
                }).then(function(stream) {
                    if (!self._userWantsRecording) {
                        try { stream.getTracks().forEach(function(t) { t.stop(); }); } catch(e) {}
                        return;
                    }

                    self.mediaStream = stream;
                    var AudioContextClass = window.AudioContext || window.webkitAudioContext;
                    if (!AudioContextClass) {
                        console.warn("[aiSpeakingSpeech] AudioContext not available, falling back to SpeechRecognition");
                        self._startRecognitionInstance();
                        return;
                    }

                    try {
                        try {
                            self.audioContext = new AudioContextClass({ sampleRate: 16000 });
                        } catch(e) {
                            self.audioContext = new AudioContextClass();
                        }
                    } catch(err) {
                        console.warn("[aiSpeakingSpeech] Failed to create AudioContext:", err);
                        self._startRecognitionInstance();
                        return;
                    }

                    try {
                        if (self.audioContext.state === 'suspended') {
                            self.audioContext.resume();
                        }

                        self.audioInputSource = self.audioContext.createMediaStreamSource(stream);
                        self.audioProcessor = self.audioContext.createScriptProcessor(2048, 1, 1);

                        self.audioProcessor.onaudioprocess = function(e) {
                            if (!self.isRecording) return;
                            var rawInput = e.inputBuffer.getChannelData(0);
                            var ctxRate = self.audioContext.sampleRate || 16000;
                            var downsampled = self._downsampleBuffer(rawInput, ctxRate, 16000);
                            if (!downsampled || downsampled.length === 0) return;

                            var sumSquares = 0;
                            for (var k = 0; k < downsampled.length; k++) {
                                sumSquares += downsampled[k] * downsampled[k];
                            }
                            var rms = Math.sqrt(sumSquares / downsampled.length);
                            if (rms > 0.012) {
                                self._hasVoiceActivity = true;
                                self._lastVoiceActivityTime = Date.now();
                            }

                            var pcm16Bytes = self._floatToPcm16(downsampled);
                            var b64Chunk = self._uint8ToBase64(pcm16Bytes);

                            if (typeof window.onAiSpeakingAudioChunk === 'function') {
                                try { window.onAiSpeakingAudioChunk(b64Chunk); } catch(err) {}
                            }

                            if (self._pcmChunkQueue.length > 80) {
                                self._pcmChunkQueue.shift();
                            }
                            self._pcmChunkQueue.push(b64Chunk);
                        };

                        var zeroGain = self.audioContext.createGain();
                        zeroGain.gain.value = 0;
                        self.zeroGain = zeroGain;

                        self.audioInputSource.connect(self.audioProcessor);
                        self.audioProcessor.connect(zeroGain);
                        zeroGain.connect(self.audioContext.destination);
                        self.isRecording = true;
                    } catch(err) {
                        console.error("[aiSpeakingSpeech] Web Audio processing graph error:", err);
                        self._startRecognitionInstance();
                    }
                }).catch(function(err) {
                    console.error("[aiSpeakingSpeech] getUserMedia error:", err);
                    self.isRecording = false;
                    self._userWantsRecording = false;
                    if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {
                        var msg = "دسترسی به میکروفون رد شد. لطفاً دسترسی به میکروفون را در تنظیمات مرورگر فعال کنید.";
                        if (!self._checkSecureContext()) {
                            msg += "\n\n(نکته: در مرورگرهای موبایل و شبکه محلی، دسترسی به میکروفون نیازمند HTTPS است.)";
                        }
                        alert(msg);
                    } else {
                        self._startRecognitionInstance();
                    }
                });
            },

            drainPcmChunks: function() {
                if (!this._pcmChunkQueue || this._pcmChunkQueue.length === 0) {
                    return "";
                }
                var drained = this._pcmChunkQueue.splice(0, this._pcmChunkQueue.length);
                return drained.join("|");
            },

            hasVoiceActivity: function() {
                var active = this._hasVoiceActivity;
                this._hasVoiceActivity = false;
                return active;
            },

            _startRecognitionInstance: function() {
                if (!this._userWantsRecording) {
                    return;
                }

                var SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!SpeechRec) return;

                if (this.recognition) {
                    try {
                        this.recognition.onend = null;
                        this.recognition.onerror = null;
                        this.recognition.onresult = null;
                        this.recognition.abort();
                    } catch(e) {}
                    this.recognition = null;
                }

                var self = this;
                var recognition = new SpeechRec();
                this.recognition = recognition;

                recognition.lang = 'en-US';
                recognition.continuous = !this._isIOS;
                recognition.interimResults = true;
                recognition.maxAlternatives = 1;

                recognition.onresult = function(event) {
                    self._consecutiveErrors = 0;
                    var sessionText = '';
                    for (var i = 0; i < event.results.length; ++i) {
                        var chunk = (event.results[i][0].transcript || '').trim();
                        if (chunk) {
                            sessionText += (sessionText ? ' ' : '') + chunk;
                        }
                    }
                    self._currentSessionTranscript = sessionText;
                    var full = self._accumulatedTranscript;
                    if (sessionText) {
                        full = (full ? full + ' ' : '') + sessionText;
                    }
                    self.transcript = full.trim();
                };

                recognition.onerror = function(event) {
                    var err = event.error || (event.message || 'unknown');
                    console.warn("[aiSpeakingSpeech] STT error:", err);

                    if (err === 'no-speech' || err === 'audio-capture' || err === 'aborted') {
                        return;
                    }

                    if (err === 'not-allowed' || err === 'service-not-allowed') {
                        self._userWantsRecording = false;
                        self.isRecording = false;
                        return;
                    }

                    self._consecutiveErrors++;
                    if (self._consecutiveErrors > 5) {
                        self.stop();
                    }
                };

                recognition.onend = function() {
                    if (self._currentSessionTranscript) {
                        self._accumulatedTranscript = (self._accumulatedTranscript ? self._accumulatedTranscript + ' ' : '') + self._currentSessionTranscript;
                        self._currentSessionTranscript = "";
                        self.transcript = self._accumulatedTranscript.trim();
                    }

                    if (self._userWantsRecording) {
                        self._restartTimeout = setTimeout(function() {
                            if (self._userWantsRecording) {
                                self._startRecognitionInstance();
                            }
                        }, 150);
                    } else {
                        self.isRecording = false;
                    }
                };

                try {
                    recognition.start();
                    this.isRecording = true;
                } catch(err) {
                    console.warn("[aiSpeakingSpeech] recognition.start() error:", err);
                    if (recognition.continuous) {
                        try {
                            recognition.continuous = false;
                            recognition.start();
                            this.isRecording = true;
                            return;
                        } catch(e) {}
                    }

                    if (this._userWantsRecording) {
                        this._restartTimeout = setTimeout(function() {
                            if (self._userWantsRecording) {
                                self._startRecognitionInstance();
                            }
                        }, 500);
                    } else {
                        this.isRecording = false;
                    }
                }
            },

            stop: function() {
                this._userWantsRecording = false;
                this.isRecording = false;

                if (this._restartTimeout) {
                    clearTimeout(this._restartTimeout);
                    this._restartTimeout = null;
                }

                if (this.audioProcessor) {
                    try {
                        this.audioProcessor.disconnect();
                        this.audioProcessor.onaudioprocess = null;
                    } catch(e) {}
                    this.audioProcessor = null;
                }

                if (this.zeroGain) {
                    try { this.zeroGain.disconnect(); } catch(e) {}
                    this.zeroGain = null;
                }

                if (this.audioInputSource) {
                    try { this.audioInputSource.disconnect(); } catch(e) {}
                    this.audioInputSource = null;
                }

                if (this.audioContext) {
                    try { this.audioContext.close(); } catch(e) {}
                    this.audioContext = null;
                }

                if (this.mediaStream) {
                    try {
                        this.mediaStream.getTracks().forEach(function(track) { track.stop(); });
                    } catch(e) {}
                    this.mediaStream = null;
                }

                if (this.recognition) {
                    try {
                        this.recognition.onend = null;
                        this.recognition.onerror = null;
                        this.recognition.stop();
                    } catch(e) {}
                    this.recognition = null;
                }

                if (this._currentSessionTranscript) {
                    this._accumulatedTranscript = (this._accumulatedTranscript ? this._accumulatedTranscript + ' ' : '') + this._currentSessionTranscript;
                    this._currentSessionTranscript = "";
                    this.transcript = this._accumulatedTranscript.trim();
                }
            },

            getTranscript: function() {
                return this.transcript || "";
            }
        };
    </script>

    <!-- Firebase Web SDK Compat scripts for Cloud Messaging -->
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-messaging-compat.js"></script>

    <script>
        window.aiSpeakingPush = {
            fcmToken: null,
            messaging: null,
            serviceWorkerRegistration: null,

            init: function() {
                if (!('serviceWorker' in navigator) || !('Notification' in window)) {
                    console.warn('[FCM Web] Service Worker or Notifications not supported in this browser.');
                    return;
                }

                try {
                    if (!firebase.apps.length) {
                        firebase.initializeApp({
                            apiKey: "AIzaSyCPIOcvS-Nc5i1mBICoXGECxau4zFzGnw8",
                            projectId: "aispeaking-132a3",
                            messagingSenderId: "160657659274",
                            storageBucket: "aispeaking-132a3.firebasestorage.app",
                            appId: "1:160657659274:web:aispeaking"
                        });
                    }
                    this.messaging = firebase.messaging();
                } catch (e) {
                    console.error('[FCM Web] Firebase initialization error:', e);
                    return;
                }

                var self = this;

                // Register Service Worker from root
                navigator.serviceWorker.register('./firebase-messaging-sw.js')
                    .then(function(registration) {
                        self.serviceWorkerRegistration = registration;
                        console.log('[FCM Web] Service Worker registered with scope:', registration.scope);

                        // If already granted, retrieve token directly
                        if (Notification.permission === 'granted') {
                            self.requestToken();
                        }
                    })
                    .catch(function(err) {
                        console.warn('[FCM Web] Service Worker registration failed:', err);
                    });

                // Foreground message listener
                this.messaging.onMessage(function(payload) {
                    console.log('[FCM Web] Foreground notification received:', payload);
                    self._handleForegroundMessage(payload);
                });

                // Listen for messages from service worker (e.g. notification click deep link)
                navigator.serviceWorker.addEventListener('message', function(event) {
                    if (event.data && event.data.type === 'FCM_DEEP_LINK') {
                        console.log('[FCM Web] Navigation message from service worker:', event.data);
                        self.navigateToUrl(event.data.url);
                    }
                });
            },

            requestPermissionAndToken: function() {
                var self = this;
                if (!('Notification' in window)) {
                    return Promise.reject(new Error("Notifications not supported"));
                }
                return Notification.requestPermission().then(function(permission) {
                    console.log('[FCM Web] Notification permission status:', permission);
                    if (permission === 'granted') {
                        return self.requestToken();
                    } else {
                        return null;
                    }
                });
            },

            requestToken: function() {
                var self = this;
                if (!this.messaging || !this.serviceWorkerRegistration) {
                    return Promise.resolve(null);
                }

                var tokenOptions = {
                    serviceWorkerRegistration: this.serviceWorkerRegistration
                };
                if (window.FIREBASE_VAPID_KEY) {
                    tokenOptions.vapidKey = window.FIREBASE_VAPID_KEY;
                }

                return this.messaging.getToken(tokenOptions)
                    .then(function(token) {
                        if (token) {
                            self.fcmToken = token;
                            try { localStorage.setItem('fcm_web_token', token); } catch(e){}
                            console.log('%c[FCM Web Token]: ' + token, 'color: #10B981; font-weight: bold;');
                            if (typeof window.onFcmWebTokenReceived === 'function') {
                                try { window.onFcmWebTokenReceived(token); } catch(e){}
                            }
                            try {
                                fetch('/api/v1/notifications/register-token', {
                                    method: 'POST',
                                    headers: { 'Content-Type': 'application/json' },
                                    body: JSON.stringify({ token: token, topic: 'aispeaking_plus_v1' })
                                }).catch(function() {});
                            } catch(e) {}
                            return token;
                        } else {
                            console.warn('[FCM Web] No registration token returned.');
                            return null;
                        }
                    })
                    .catch(function(err) {
                        console.warn('[FCM Web] Error getting FCM web token:', err);
                        return null;
                    });
            },

            navigateToUrl: function(url) {
                if (!url) return;
                try {
                    var parsed = new URL(url, window.location.origin);
                    if (parsed.hash) {
                        window.location.hash = parsed.hash;
                    }
                } catch(e) {
                    if (url.indexOf('#') !== -1) {
                        window.location.hash = url.substring(url.indexOf('#'));
                    }
                }
            },

            _handleForegroundMessage: function(payload) {
                var title = payload.notification?.title || payload.data?.title || 'AI Speaking Plus';
                var body = payload.notification?.body || payload.data?.body || payload.data?.message || '';
                var data = payload.data || {};

                if (Notification.permission === 'granted') {
                    try {
                        var n = new Notification(title, {
                            body: body,
                            icon: payload.notification?.icon || data.icon || './android-chrome-192x192.png',
                            data: data
                        });
                        var self = this;
                        n.onclick = function() {
                            n.close();
                            window.focus();
                            if (data.url) {
                                self.navigateToUrl(data.url);
                            } else if (data.stage_id || data.stageId) {
                                var stageId = data.stage_id || data.stageId;
                                window.location.hash = 'chat?stageId=' + encodeURIComponent(stageId);
                            } else if (data.screen) {
                                var screen = data.screen.toLowerCase().trim();
                                if (screen === 'profile') window.location.hash = 'profile';
                                else if (screen === 'subscription' || screen === 'sub') window.location.hash = 'subscription';
                                else if (screen === 'stages' || screen === 'stages_list') window.location.hash = 'stages';
                                else if (screen === 'login') window.location.hash = 'login';
                                else window.location.hash = 'main';
                            }
                        };
                    } catch(e) {
                        console.warn('[FCM Web] Foreground notification presentation failed:', e);
                    }
                }
            }
        };

        // Initialize when window finishes loading
        window.addEventListener('load', function() {
            window.aiSpeakingPush.init();
        });

        // Request permission on first user gesture (click/tap) if still in 'default' state
        var requestNotificationOnGesture = function() {
            if (window.Notification && Notification.permission === 'default') {
                window.aiSpeakingPush.requestPermissionAndToken();
            }
            window.removeEventListener('click', requestNotificationOnGesture);
            window.removeEventListener('touchend', requestNotificationOnGesture);
        };
        window.addEventListener('click', requestNotificationOnGesture, { once: true });
        window.addEventListener('touchend', requestNotificationOnGesture, { once: true });
    </script>
    <script src="webApp.js"></script>
