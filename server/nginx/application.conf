sudo bash -c 'cat <<EOF > /etc/nginx/sites-available/staging
server {
    listen 80;
    server_name staging.aispeaking.ir;

    # ۱. بخش فرانت‌اند
    location / {
        root /var/www/aispeaking.ir/html;
        index index.html;
        try_files \$uri \$uri/ /index.html;

        # پشتیبانی از WebSocket برای فرانت
        proxy_http_version 1.1;
        proxy_set_header Upgrade \$http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ۲. بخش تصاویر و فایل‌های استاتیک Ktor
    location /resources/ {
        proxy_pass http://127.0.0.1:8080/resources/;
        proxy_set_header Host \$host;
        proxy_set_header X-Real-IP \$remote_addr;
        proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto \$scheme;

        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # ۳. بخش APIها و WebSocket
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host \$host;
        proxy_set_header X-Real-IP \$remote_addr;
        proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto \$scheme;

        # تنظیمات حیاتی برای WebSocket (چت و Sherpa)
        proxy_http_version 1.1;
        proxy_set_header Upgrade \$http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
EOF'